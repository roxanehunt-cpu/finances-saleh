<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{var __t=localStorage.getItem("finsaleh.theme");if(__t)document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<title>Saleh Wealth</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Saleh Wealth">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css">
<style>
/* Thème clair par défaut (fond blanc), thème sombre en option */
:root{
  --bg:#FFFFFF; --side:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F5F8; --hover:#EDF2F6; --field:#F6F9FB;
  --line:#E1E8EE; --line-strong:#C9D5DE;
  --ink:#0B1824; --ink-2:#41566A; --ink-3:#66798A;
  --accent:#437B98; --accent-hi:#3A86AD; --accent-ink:#2B6A8A; --accent-soft:rgba(67,123,152,.12);
  --pos:#0E9F6E; --pos-soft:rgba(14,159,110,.12);
  --neg:#D6334A; --neg-soft:rgba(214,51,74,.10);
  --warn:#B45309; --warn-soft:rgba(217,119,6,.14);
  --danger-solid:#DC3F4A;
  --bar-bg:#E6EDF2; --bar-bg2:#E6EDF2; --scrim:rgba(11,24,36,.45); --tabbar:rgba(255,255,255,.96); --kc2:#F6F9FB; --topbar:rgba(255,255,255,.92);
  --bubble:#FFFFFF; --bubble-line:#9CB9CB; --ph:#8A9BA9; --zero:#9AA9B5; --shadow:0 1px 2px rgba(11,24,36,.06);
  --radius:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1824; --side:#08131D; --surface:#102335; --surface-2:#173049; --hover:#14293F; --field:#0C1B2A;
  --line:#1F3A52; --line-strong:#2E4E69;
  --ink:#EAF3F4; --ink-2:#B9CAD3; --ink-3:#8EA3B0;
  --accent:#437B98; --accent-hi:#5190AE; --accent-ink:#96CAD3; --accent-soft:rgba(150,202,211,.15);
  --pos:#34D399; --pos-soft:rgba(52,211,153,.14);
  --neg:#FB7185; --neg-soft:rgba(251,113,133,.14);
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
  --bar-bg:#1B3249; --bar-bg2:#0C1B2A; --scrim:rgba(2,8,14,.72); --tabbar:rgba(8,19,29,.96); --kc2:#0D1F30; --topbar:rgba(11,24,36,.88);
  --bubble:#0F2438; --bubble-line:#2E6FA8; --ph:#5F7686; --zero:#4F6577; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.side{
  position:fixed; inset:0 auto 0 0; width:244px; background:var(--side); border-right:1px solid var(--line); color:var(--ink);
  display:flex; flex-direction:column; padding:20px 14px 16px; z-index:20;
}
.brand{display:flex; align-items:center; gap:12px; padding:4px 8px 20px}
.logo{width:34px; height:34px; border-radius:9px; flex-shrink:0; display:block}
.loginlogo{display:block; width:60px; height:60px; border-radius:15px; margin:0 auto 12px}
.logincenter{text-align:center}
.brand-name{font-weight:650; font-size:15px; letter-spacing:-.01em}
.brand-sub{font-size:12px; color:var(--ink-3)}
.newbtn{margin:0 4px 18px; height:40px; font-size:14px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:0; border-radius:8px; padding:10px 12px; cursor:pointer;
  color:var(--ink-3); font-weight:500;
}
.nav button svg{width:18px; height:18px; flex-shrink:0}
.nav button:hover{background:var(--surface); color:var(--ink)}
.nav button.active{background:var(--surface-2); color:var(--ink); box-shadow:inset 3px 0 0 var(--accent-hi)}
.side-foot{margin-top:auto; border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px}
.user-btn{display:flex; align-items:center; gap:10px; background:none; border:0; cursor:pointer; padding:6px 8px; border-radius:8px; color:var(--ink); text-align:left; width:100%}
.user-btn:hover{background:var(--surface)}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line-strong); display:grid; place-items:center; font-weight:600; font-size:13px; flex-shrink:0}
.user-name{font-weight:550; line-height:1.2}
.user-sub{font-size:12px; color:var(--ink-3)}

.main-col{margin-left:244px; min-height:100vh}
.topbar{
  position:sticky; top:0; z-index:10; background:var(--topbar); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:14px 32px; display:flex; align-items:center; gap:16px;
}
.topbar h1{margin:0; font-size:20px; font-weight:650; letter-spacing:-.015em; flex:1}
.topbar .m-logo{display:none}
.chip{
  display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 11px; cursor:pointer;
}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.chip.ok .dot{background:var(--pos)} .chip.syncing .dot{background:var(--accent-ink)}
.chip.offline .dot{background:var(--warn)} .chip.error .dot{background:var(--neg)}
.side .chip{background:transparent}
.side .chip:hover{background:var(--surface)}
.page{padding:24px 32px 56px; max-width:1180px}

/* ---------- Composants ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:20px}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:16px 20px 0}
.panel-head h2{margin:0; font-size:15px; font-weight:600; letter-spacing:-.005em}
.panel-head .sub{font-size:12.5px; color:var(--ink-3); font-weight:400}
.panel-body{padding:16px 20px 20px}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

.hero{background:var(--surface-2); border:1px solid var(--line-strong); border-radius:16px; padding:22px 26px 24px; margin-bottom:20px}
.hero-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.mnav{width:34px; height:34px; border-radius:50%; border:1px solid var(--line-strong); background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--ink-2); font-size:18px; line-height:1}
.mnav:hover:not([disabled]){background:var(--hover); color:var(--ink)}
.mnav[disabled]{opacity:.35; cursor:default}
.hero-month{font-weight:600; font-size:15px; min-width:150px; text-align:center}
.hero-top .pill{margin-left:auto}
.hero-label{color:var(--ink-2); font-size:14px}
.hero-num{font-size:54px; font-weight:650; letter-spacing:-.035em; line-height:1.1; margin:2px 0 4px; font-variant-numeric:tabular-nums}
.hero-sub{color:var(--ink-3); font-size:14px}
.meter{margin:20px 0 8px}
.meter .bar{height:10px}
.meter-cap{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--ink-2); margin-top:8px}
.hero-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}

.insights{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:20px}
.insight{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px}
.insight .label{font-size:13px; color:var(--ink-3)}
.insight .value{font-size:26px; font-weight:650; letter-spacing:-.02em; margin:4px 0 2px; font-variant-numeric:tabular-nums}
.insight .hint{font-size:12.5px; color:var(--ink-3)}
.insight .bar{margin-top:10px}

.kpis{display:grid; grid-template-columns:repeat(4,1fr)}
.kpi{padding:18px 20px; border-left:1px solid var(--line); min-width:0}
.kpi:first-child{border-left:0}
.kpi .label{font-size:13px; color:var(--ink-3)}
.kpi .value{font-size:24px; font-weight:650; letter-spacing:-.02em; margin:4px 0 2px; font-variant-numeric:tabular-nums; white-space:nowrap}
.kpi .hint{font-size:12.5px; color:var(--ink-3)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 14px;
  border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:550; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--accent-hi); border-color:var(--accent-hi)}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn.secondary:hover{background:var(--hover)}
.btn.danger{background:transparent; color:var(--neg); border-color:rgba(251,113,133,.4)}
.btn.danger:hover{background:var(--neg-soft)}
.btn.danger.solid{background:var(--danger-solid); color:#fff; border-color:var(--danger-solid)}
.btn.sm{height:28px; padding:0 10px; font-size:12.5px}
.btn.icon{width:28px; padding:0}
.btn.lg{height:46px; font-size:15px; width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}

input[type=text],input[type=number],input[type=month],input[type=url],input[type=date],select{
  height:38px; width:100%; padding:0 10px; border:1px solid var(--line-strong); border-radius:8px; background:var(--field); color:var(--ink);
}
select{padding-right:6px}
.topbar select, .tools select, .panel-head select{width:auto; height:34px}
input::placeholder{color:var(--ph)}
input:focus,select:focus{outline:2px solid var(--accent-ink); outline-offset:-1px; border-color:var(--accent-ink)}

.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; min-width:620px}
th{text-align:left; font-weight:500; font-size:12.5px; color:var(--ink-3); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface); white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
tr.detail td{background:var(--field); padding:16px 20px}
tfoot td{font-weight:600; background:var(--surface-2); border-top:1px solid var(--line-strong)}
td.zero{color:var(--zero)}
.rowbtn{background:none; border:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:550; white-space:nowrap}
.chev{display:inline-block; width:14px; transition:transform .15s; color:var(--ink-3)}
.open .chev{transform:rotate(90deg)}
th:first-child,td:first-child{position:sticky; left:0; z-index:1}
td:first-child{background:var(--surface)}
tr.row:hover td:first-child{background:var(--hover)}
tr.detail td:first-child{background:var(--field)}
tfoot td:first-child{background:var(--surface-2)}

.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:550}
.pill.todo{background:var(--neg-soft); color:var(--neg)}
.pill.progress{background:var(--warn-soft); color:var(--warn)}
.pill.done{background:var(--pos-soft); color:var(--pos)}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.grid2{margin-bottom:20px}
.grid2 > .panel{margin-bottom:0}
.hero-month small{font-weight:400; color:var(--ink-3)}
.gap{margin-bottom:20px}
.ledger{width:100%; min-width:0}
.ledger td{padding:7px 0; border-bottom:1px solid var(--line)}
.ledger td:first-child{position:static; background:transparent!important}
.ledger tr.sub td{font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0; padding-top:9px}
.ledger tr.group td{font-size:12.5px; color:var(--ink-3); font-weight:500; padding-top:14px; border-bottom:1px solid var(--line-strong)}

.legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font-size:12.5px; color:var(--ink-2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.chart svg{display:block; overflow:visible}
.gl{stroke:var(--line)} .gl0{stroke:var(--line-strong)} .tk{fill:var(--ink-3)}
.donut-wrap{display:flex; gap:28px; align-items:center; flex-wrap:wrap}
.donut-legend{flex:1; min-width:240px}
.donut-legend .li{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line)}
.donut-legend .li:last-child{border-bottom:0}
.donut-legend .sw{width:10px; height:10px; border-radius:2px; flex-shrink:0}
.donut-legend .nm{flex:1}
.donut-legend .pc{color:var(--ink-3); width:44px; text-align:right}

.bar{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.panel .bar{background:var(--bar-bg)}
.hero .bar{background:var(--bar-bg2)}
.bar > i{display:block; height:100%; background:var(--accent-hi); border-radius:99px}
.bar.pos > i,.bar > i.ok{background:var(--pos)}
.bar > i.warn{background:var(--warn)}
.bar > i.over{background:var(--neg)}
.bar > i.neutral{background:#5F8399}

.bud{display:grid; grid-template-columns:minmax(90px,1.1fr) 2fr minmax(90px,auto); gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .nm{font-weight:500}
.bud .amt{text-align:right; font-size:13px}
.bud .amt small{display:block; color:var(--ink-3); font-size:12px}

.exlist .ex{display:grid; grid-template-columns:48px 1fr auto auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.exlist .ex:last-child{border-bottom:0}
.ex .dt{font-size:12px; color:var(--ink-3); line-height:1.2}
.ex .ti{min-width:0}
.ex .ti b{font-weight:550}
.ex .ti span{display:block; font-size:12.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.proj-row{display:grid; grid-template-columns:minmax(120px,240px) 1fr 140px; gap:16px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.proj-row:last-child{border-bottom:0}
.items .it{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.items .it:last-child{border-bottom:0}
.items input[type=checkbox]{width:17px; height:17px; accent-color:var(--accent-hi); flex-shrink:0}
.items .lb{flex:1; background:none; border:0; text-align:left; cursor:pointer; padding:0}
.items .lb.done{color:var(--ink-3); text-decoration:line-through}
.additem{display:flex; gap:8px; margin-top:14px}
.additem input[type=number]{max-width:150px}
.empty{padding:28px 10px; text-align:center; color:var(--ink-3)}
.banner{display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--warn-soft); border:1px solid rgba(251,191,36,.35); color:#F5DDA0; border-radius:var(--radius); padding:12px 16px; margin-bottom:20px}
.banner b{font-weight:600; color:var(--warn)}
.banner > span{flex:1; min-width:220px}
.banner .btn{margin-left:auto}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:60}
.modal{background:var(--surface); border:1px solid var(--line-strong); border-radius:16px; width:100%; max-width:460px; padding:24px}
.modal.wide{max-width:660px}
.modal h3{margin:0 0 4px; font-size:17px; font-weight:650; letter-spacing:-.01em}
.modal .sub{margin:0 0 18px; color:var(--ink-3); font-size:13px}
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:5px}
.help{font-size:12.5px; color:var(--ink-3); margin-top:5px}
.actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px}
.actions .left{margin-right:auto}
.sect{border-top:1px solid var(--line); margin-top:18px; padding-top:16px}
.sect:first-of-type{border-top:0; margin-top:0; padding-top:0}
.sect h4{margin:0 0 10px; font-size:13.5px; font-weight:600}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px}
.fgrid .field{margin:0}
.livetotal{display:flex; justify-content:space-between; align-items:baseline; background:var(--field); border-radius:8px; padding:10px 14px; margin-top:16px}
.livetotal b{font-size:16px; font-variant-numeric:tabular-nums}
.pickuser{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pickuser button{height:64px; border:1px solid var(--line-strong); background:var(--field); border-radius:10px; cursor:pointer; font-weight:600; font-size:15px}
.pickuser button:hover{border-color:var(--accent-ink); background:var(--accent-soft)}
details{margin-top:10px}
summary{cursor:pointer; color:var(--accent-ink); font-weight:500}
pre{background:var(--field); border-radius:8px; padding:12px; overflow:auto; font-size:12px; line-height:1.5; margin:8px 0 0}
.catrow{display:flex; gap:8px; margin-bottom:8px}
.catgrid{display:grid; grid-template-columns:minmax(0,1fr) 104px 104px auto; gap:8px; margin-bottom:8px; align-items:center}
.catgrid.head{font-size:12px; color:var(--ink-3); margin-bottom:4px}
.catgrid.head2{grid-template-columns:minmax(0,1fr) 104px auto}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13.5px; font-weight:500; z-index:80; max-width:90vw}
.toast.err{background:var(--danger-solid); color:#fff}

/* Journal */
.dayhead{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-3); font-weight:500; padding:14px 0 4px}
.dayhead:first-child{padding-top:0}
.ex2{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.ex2 .ti{background:none; border:0; text-align:left; cursor:pointer; padding:0; min-width:0; color:inherit}
.ex2 .ti b{font-weight:550; display:block}
.ex2 .ti span{display:block; font-size:12.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.catbtn{width:100%; background:none; border:0; border-bottom:1px solid var(--line); text-align:left; cursor:pointer; color:inherit; border-radius:0}
.catbtn.sel{background:var(--accent-soft)}
.catbtn:last-child{border-bottom:0}

/* Saisie rapide */
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px}
.seg button{height:34px; border:0; border-radius:7px; background:transparent; color:var(--ink-3); font-weight:550; cursor:pointer}
.seg button.on{background:var(--surface-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-strong)}
.bigamt{display:flex; align-items:baseline; justify-content:center; gap:8px; margin:18px 0 6px}
.bigamt input{height:64px; font-size:38px; font-weight:650; text-align:center; letter-spacing:-.02em; max-width:290px; border-color:transparent; background:transparent; font-variant-numeric:tabular-nums}
.bigamt input:focus{outline:0; border-color:transparent; border-bottom:2px solid var(--accent-ink); border-radius:0}
.bigamt span{font-size:20px; color:var(--ink-3); font-weight:600}
.qgroup{font-size:12px; color:var(--ink-3); margin:12px 0 6px}
.cats{display:flex; flex-wrap:wrap; gap:8px}
.cat-chip{border:1px solid var(--line-strong); background:var(--field); color:var(--ink-2); border-radius:999px; padding:7px 14px; cursor:pointer; font-weight:500}
.cat-chip:hover{border-color:var(--accent-ink)}
.cat-chip.on{background:var(--accent); border-color:var(--accent); color:#fff}

/* ---------- Mobile ---------- */
.tabbar{display:none}
@media (max-width:899px){
  .side{display:none}
  .main-col{margin-left:0}
  .topbar{padding:12px 16px; gap:10px}
  .topbar .m-logo{display:grid; width:30px; height:30px; font-size:15px}
  .topbar h1{font-size:18px}
  .page{padding:16px 16px 100px}
  .tabbar{
    display:flex; align-items:flex-end; position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--tabbar); backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; background:none; border:0; color:var(--ink-3); font-size:11.5px; font-weight:500; cursor:pointer}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('fr-FR');
const fmt = n => nf.format(Math.round(n||0)) + ' F';
function fmtC(n){
  const a = Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' M';
  if(a>=1e3) return Math.round(n/1e3)+' k';
  return String(Math.round(n));
}

const monthLabel = ym => { const [y,m]=ym.split('-'); return MS[+m-1]+' '+y; };
const monthLong  = ym => { const [y,m]=ym.split('-'); return ML[+m-1]+' '+y; };
const pad = n => String(n).padStart(2,'0');
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nextMois(ym){ let [y,m]=ym.split('-').map(Number); m++; if(m>12){m=1;y++;} return y+'-'+pad(m); }
function uid(){ return Math.random().toString(36).slice(2,10); }
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (arr,f) => arr.reduce((s,x)=>s+f(x),0);
function stable(v){
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
const strip = o => { const c={...o}; delete c._u; return c; };

/* ============================================================
   ÉTAT, PERSISTANCE LOCALE ET SYNCHRONISATION
   - Chaque modification est enregistrée immédiatement sur l'appareil
     (localStorage) : une actualisation ne fait plus rien perdre.
   - Si la synchronisation est configurée, les appareils fusionnent
     leurs données (la modification la plus récente gagne, élément par élément).
   ============================================================ */
let state, lastHash = {}, currentUser = null;
let ui = { tab:'synthese', year:'', statut:'all', expanded:null, month:null, cat:'all', showZero:false };

function emptyGroup(group, cats){ const o={}; cats[group].forEach(c=>o[c.id]=0); return o; }
function emptyMonth(mois){
  return {mois, entreeAnnexe:emptyGroup('entreeAnnexe',state?state.categories:SEED_CATEGORIES),
    salaire:{nassim:0,roxane:0},
    chargesFixes:emptyGroup('chargesFixes',state?state.categories:SEED_CATEGORIES),
    chargesVariables:emptyGroup('chargesVariables',state?state.categories:SEED_CATEGORIES),
    epargne:{nassim:0,roxane:0,both:0}, statut:'L', _u:0};
}
function normalize(s){
  const o = {...s};
  o.months = asArray(o.months).map(m=>({
    mois:m.mois, statut:m.statut||'L', _u:m._u||0,
    salaire:{nassim:0,roxane:0,...(m.salaire||{})},
    entreeAnnexe:{...(m.entreeAnnexe||{})}, chargesFixes:{...(m.chargesFixes||{})}, chargesVariables:{...(m.chargesVariables||{})},
    epargne:{nassim:0,roxane:0,both:0,...(m.epargne||{})}
  }));
  o.expenses = asArray(o.expenses).map(e=>({id:e.id, date:e.date||'', amount:+e.amount||0, group:e.group||'chargesVariables', cat:e.cat||'', who:e.who||'', note:e.note||'', _u:e._u||0}));
  o.projects = asArray(o.projects).map(p=>({id:p.id, title:p.title||'', target:p.target||'', img:p.img||'', budget:+p.budget||0, prio:+p.prio||0, acc:p.acc||'', kind:p.kind||'', _u:p._u||0,
    items:asArray(p.items).map(i=>({id:i.id, label:i.label||'', amount:+i.amount||0, checked:!!i.checked, paid:+i.paid||0, st:i.st||''}))}));
  o.accounts = asArray(o.accounts).map(a=>({id:a.id, name:a.name||'', bank:a.bank||'', kind:a.kind||'courant', start:+a.start||0, _u:a._u||0, moves:asArray(a.moves).map(x=>({id:x.id, date:x.date||'', amount:+x.amount||0, note:x.note||''}))}));
  const c = o.categories||{};
  o.categories = {};
  ['entreeAnnexe','chargesFixes','chargesVariables'].forEach(g=>{ o.categories[g] = (asArray(c[g]).length||c[g]!==undefined ? asArray(c[g]) : SEED_CATEGORIES[g]).map(x=>({id:x.id,label:x.label,budget:+x.budget||0,rec:+x.rec||0,day:+x.day||0})); });
  const sr = c.salaryRec||{}; o.categories.salaryRec = {nassim:+sr.nassim||0, roxane:+sr.roxane||0};
  o.goal = {label:'', target:0, ...(o.goal||{})}; o.goal.startN = +o.goal.startN||0; o.goal.startR = +o.goal.startR||0;
  o.catsU = o.catsU||0; o.goalU = o.goalU||0; o.tomb = {...(o.tomb||{})};
  o.updatedAt = o.updatedAt||0; o.updatedBy = o.updatedBy||'';
  return o;
}
function seedState(){
  const months = SEED_MONTHS.map(m=>({...m,_u:0}));
  let last = months[months.length-1].mois;
  const tmp = clone(SEED_CATEGORIES);
  while(last < '2027-12'){
    last = nextMois(last);
    months.push({mois:last, statut:'L', _u:0, salaire:{nassim:0,roxane:0},
      entreeAnnexe:emptyGroup('entreeAnnexe',tmp), chargesFixes:emptyGroup('chargesFixes',tmp), chargesVariables:emptyGroup('chargesVariables',tmp),
      epargne:{nassim:0,roxane:0,both:0}});
  }
  return normalize({months, projects:clone(SEED_PROJECTS), categories:clone(SEED_CATEGORIES), goal:{label:'',target:0}});
}
function snapshot(s){
  const h = {};
  s.months.forEach(m=>h['m:'+m.mois]=stable(strip(m)));
  s.projects.forEach(p=>h['p:'+p.id]=stable(strip(p)));
  s.expenses.forEach(e=>h['e:'+e.id]=stable(strip(e)));
  s.accounts.forEach(a=>h['a:'+a.id]=stable(strip(a)));
  h.cats = stable(s.categories); h.goal = stable(s.goal);
  return h;
}
function content(s){ return stable({months:s.months, projects:s.projects, expenses:s.expenses, accounts:s.accounts, categories:s.categories, goal:s.goal, catsU:s.catsU, goalU:s.goalU, tomb:s.tomb}); }
function pub(s){ return {v:2, updatedAt:s.updatedAt, updatedBy:s.updatedBy, months:s.months, projects:s.projects, expenses:s.expenses, accounts:s.accounts, categories:s.categories, goal:s.goal, catsU:s.catsU, goalU:s.goalU, tomb:s.tomb}; }

function localLoad(){

}
/* À appeler après toute modification : horodate ce qui a changé, enregistre, planifie la synchro. */
function persist(){
  const now = Date.now(), seen = new Set();
  state.months.forEach(m=>{ const k='m:'+m.mois; seen.add(k); const h=stable(strip(m)); if(lastHash[k]!==h){ m._u=now; lastHash[k]=stable(strip(m)); } });
  state.projects.forEach(p=>{ const k='p:'+p.id; seen.add(k); const h=stable(strip(p)); if(lastHash[k]!==h){ p._u=now; lastHash[k]=stable(strip(p)); } });
  state.expenses.forEach(e=>{ const k='e:'+e.id; seen.add(k); const h=stable(strip(e)); if(lastHash[k]!==h){ e._u=now; lastHash[k]=stable(strip(e)); } });
  state.accounts.forEach(a=>{ const k='a:'+a.id; seen.add(k); const h=stable(strip(a)); if(lastHash[k]!==h){ a._u=now; lastHash[k]=stable(strip(a)); } });
  Object.keys(lastHash).forEach(k=>{ if(/^[mpea]:/.test(k) && !seen.has(k)){ state.tomb[k]=now; delete lastHash[k]; } });
  const hc = stable(state.categories); if(lastHash.cats!==hc){ state.catsU=now; lastHash.cats=hc; }
  const hg = stable(state.goal); if(lastHash.goal!==hg){ state.goalU=now; lastHash.goal=hg; }
  state.updatedAt = now; state.updatedBy = currentUser||'';
  localSave();
  scheduleSync();
  renderChrome();
}

function mergeStates(a, b){ // a = local, b = distant
  const tomb = {};
  [a.tomb,b.tomb].forEach(t=>Object.entries(t||{}).forEach(([k,v])=>{ tomb[k]=Math.max(tomb[k]||0, v); }));
  const pick = (la, ra, keyFn)=>{
    const map = new Map();
    ra.concat(la).forEach(it=>{ const k=keyFn(it); const cur=map.get(k); if(!cur || (it._u||0) >= (cur._u||0)) map.set(k,it); });
    return [...map.values()].filter(it=>{ const t=tomb[keyFn(it)]; return t===undefined || (it._u||0) > t; });
  };
  const useA = (a.catsU||0) >= (b.catsU||0), goalA = (a.goalU||0) >= (b.goalU||0);
  const newer = (a.updatedAt||0) >= (b.updatedAt||0) ? a : b;
  const cutoff = Date.now() - 180*86400000;
  Object.keys(tomb).forEach(k=>{ if(tomb[k] < cutoff) delete tomb[k]; });
  return {
    months: pick(a.months,b.months,m=>'m:'+m.mois), projects: pick(a.projects,b.projects,p=>'p:'+p.id), expenses: pick(a.expenses,b.expenses,e=>'e:'+e.id), accounts: pick(a.accounts||[],b.accounts||[],x=>'a:'+x.id),
    categories: clone(useA?a.categories:b.categories), catsU: Math.max(a.catsU||0,b.catsU||0),
    goal: clone(goalA?a.goal:b.goal), goalU: Math.max(a.goalU||0,b.goalU||0),
    tomb, updatedAt: newer.updatedAt, updatedBy: newer.updatedBy
  };
}

/* ---------- Synchronisation (Firebase Realtime Database ou Worker compatible) ---------- */
let syncStatus = {kind:'local', msg:'', at:0}, syncing = false, syncQueued = false, syncTimer = null;
/* Connexion par e-mail et mot de passe (Firebase Authentication). La session reste ouverte sur l'appareil. */
let auth = null;
try{ auth = JSON.parse(localStorage.getItem(LS.auth)||'null'); }catch(e){}
const keyOk = () => /^AIza[\w-]{30,}$/.test(CONFIG.API_KEY);
function saveAuth(){ try{ if(auth) localStorage.setItem(LS.auth, JSON.stringify(auth)); else localStorage.removeItem(LS.auth); }catch(e){} }
const AUTH_ERR = {
  EMAIL_NOT_FOUND:'Aucun compte avec cet e-mail.', INVALID_PASSWORD:'Mot de passe incorrect.', INVALID_LOGIN_CREDENTIALS:'E-mail ou mot de passe incorrect.',
  USER_DISABLED:'Ce compte est désactivé.', TOO_MANY_ATTEMPTS_TRY_LATER:'Trop de tentatives. Réessayez dans quelques minutes.',
  OPERATION_NOT_ALLOWED:"La connexion par e-mail n'est pas activée dans Firebase (Authentication, Sign-in method).", INVALID_EMAIL:"Cet e-mail n'est pas valide."
};
async function fbPost(url, body, form){
  const ctrl = new AbortController(), tm = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const res = await fetch(url+'?key='+encodeURIComponent(CONFIG.API_KEY), {method:'POST', signal:ctrl.signal,
      headers:{'Content-Type': form?'application/x-www-form-urlencoded':'application/json'}, body: form?new URLSearchParams(body).toString():JSON.stringify(body)});
    const j = await res.json().catch(()=>({}));
    if(!res.ok){ const code = ((j.error&&j.error.message)||'').split(' ')[0]; const e = new Error(code||('HTTP '+res.status)); e.fb = code; e.status = res.status; throw e; }
    return j;
  } finally { clearTimeout(tm); }
}
async function signIn(email, password){
  const r = await fbPost('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword', {email, password, returnSecureToken:true});
  auth = {email:r.email||email, idToken:r.idToken, refreshToken:r.refreshToken, exp:Date.now()+(+r.expiresIn||3600)*1000}; saveAuth();
}
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('load')); document.head.appendChild(s); }); }
async function googleSignIn(){
  const V = '10.12.2';
  if(!window.firebase){ await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-app-compat.js'); await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-auth-compat.js'); }
  if(!firebase.apps.length) firebase.initializeApp({apiKey:CONFIG.API_KEY, authDomain:CONFIG.AUTH_DOMAIN, projectId:CONFIG.PROJECT_ID});
  const r = await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
  const tr = await r.user.getIdTokenResult();
  auth = {email:r.user.email, idToken:tr.token, refreshToken:r.user.refreshToken, exp:Date.parse(tr.expirationTime)||Date.now()+3500000}; saveAuth();
}
const GOOGLE_ERR = {
  'auth/unauthorized-domain':"Ce site n'est pas autorisé dans Firebase : ajoutez roxanehunt-cpu.github.io dans Authentication, Paramètres, Domaines autorisés.",
  'auth/operation-not-allowed':"La connexion Google n'est pas activée dans Firebase (Authentication, Méthode de connexion).",
  'auth/popup-blocked':"La fenêtre Google a été bloquée. Autorisez les fenêtres pop-up pour ce site, ou utilisez l'e-mail.",
  'auth/popup-closed-by-user':"Connexion Google annulée.", 'auth/cancelled-popup-request':"Connexion Google annulée.",
  'auth/network-request-failed':"Connexion impossible. Vérifiez le réseau."
};
let syncGen = 0;
function signOut(){
  auth = null; saveAuth(); syncGen++; clearTimeout(syncTimer); syncQueued = false;
  try{ if(window.firebase && firebase.apps.length) firebase.auth().signOut().catch(()=>{}); }catch(e){}
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  setStatus('local','Déconnecté.'); openLogin(); render();
}
async function getToken(){
  if(!auth) return null;
  if(Date.now() < auth.exp - 120000) return auth.idToken;
  const r = await fbPost('https://securetoken.googleapis.com/v1/token', {grant_type:'refresh_token', refresh_token:auth.refreshToken}, true);
  auth = {...auth, idToken:r.id_token, refreshToken:r.refresh_token||auth.refreshToken, exp:Date.now()+(+r.expires_in||3600)*1000}; saveAuth();
  return auth.idToken;
}
function syncEnabled(){ return keyOk() && !!auth; }
async function remoteUrl(){ const tok = await getToken(); return CONFIG.SYNC_URL.replace(/\/+$/,'')+'/foyer.json?auth='+encodeURIComponent(tok); }
function setStatus(kind, msg){ syncStatus = {kind, msg:msg||'', at: kind==='ok'?Date.now():syncStatus.at}; renderStatus(); }
function renderStatus(){
  const labels = {local:'Local uniquement', syncing:'Synchronisation…', ok:'Synchronisé', offline:'Hors ligne', error:'Erreur de synchro'};
  document.querySelectorAll('[data-chip]').forEach(c=>{
    c.className = 'chip '+syncStatus.kind; c.querySelector('.txt').textContent = labels[syncStatus.kind];
    c.title = syncStatus.msg || labels[syncStatus.kind];
  });
}
async function rfetch(method, body){
  const url = await remoteUrl();
  const ctrl = new AbortController(), t = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const res = await fetch(url, {method, headers: body?{'Content-Type':'application/json'}:undefined, body: body?JSON.stringify(body):undefined, signal:ctrl.signal, cache:'no-store'});
    if(!res.ok){ const e = new Error('HTTP '+res.status); e.status = res.status; throw e; }
    return await res.json();
  } finally { clearTimeout(t); }
}
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 700); }
async function sync(){
  if(!syncEnabled()){ setStatus('local', keyOk() ? 'Non connecté : les données sont enregistrées sur cet appareil uniquement.' : 'Synchronisation non configurée.'); renderBanner(); return {ok:false, reason:'disabled'}; }
  if(syncing){ syncQueued = true; return {ok:false, reason:'busy'}; }
  syncing = true; setStatus('syncing'); const gen = syncGen;
  let result = {ok:true};
  try{
    const raw = await rfetch('GET');
    if(gen!==syncGen) return {ok:false, reason:'signed-out'};
    const remote = raw ? normalize(raw) : null;
    let merged = state;
    if(remote){
      const m = mergeStates(state, remote);
      merged = normalize({...m, v:2});
      if(content(merged) !== content(state)){ state = merged; lastHash = snapshot(state); localSave(); autoRecurring(); render(); }
    }
    if(gen!==syncGen) return {ok:false, reason:'signed-out'};
    if(!remote || content(state) !== content(remote)){ await rfetch('PUT', pub(state)); }
    setStatus('ok', 'Dernière synchronisation à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    result = {ok:false, error:e};
    if(gen!==syncGen){ /* déconnecté entre-temps */ }
    else if(e.fb && /TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED|INVALID_GRANT/.test(e.fb)){ auth = null; saveAuth(); setStatus('error','Session expirée : reconnectez-vous.'); setTimeout(openLogin, 300); }
    else if(e.status===401 || e.status===403) setStatus('error', "Accès refusé : vérifiez les règles de la base Firebase (voir les instructions) et que ce compte existe.");
    else if(e.status===404) setStatus('error', "Base introuvable : vérifiez l'adresse de la base Firebase.");
    else if(e.name==='AbortError' || e instanceof TypeError) setStatus('offline', "Connexion impossible. Vos modifications restent enregistrées sur cet appareil et seront envoyées dès le retour du réseau.");
    else setStatus('error', 'Erreur : '+(e.message||e));
  }finally{
    syncing = false; renderBanner();
    if(syncQueued){ syncQueued = false; sync(); }
  }
  return result;
}

/* ============================================================
   CALCULS
   ============================================================ */
const sumObj = o => Object.values(o||{}).reduce((s,v)=>s+(parseFloat(v)||0),0);
let _ex = {key:'', idx:{}};
function expIdx(){
  const E = state.expenses, key = E.length+':'+E.reduce((s,e)=>s+(e._u||0),0);
  if(_ex.key!==key){
    const idx = {};
    E.forEach(e=>{ const mo=(e.date||'').slice(0,7); if(!mo) return; const g=(idx[mo]=idx[mo]||{}); const gg=(g[e.group]=g[e.group]||{}); gg[e.cat]=(gg[e.cat]||0)+e.amount; });
    _ex = {key, idx};
  }
  return _ex.idx;
}
/* Mois "effectif" : montants saisis + dépenses rapides du mois */
function eff(m){
  const x = expIdx()[m.mois]; if(!x) return m;
  const o = {...m};
  ['entreeAnnexe','chargesFixes','chargesVariables'].forEach(g=>{ const b={...m[g]}; Object.entries(x[g]||{}).forEach(([k,v])=>{ b[k]=(b[k]||0)+v; }); o[g]=b; });
  return o;
}
const sumG = (m,g) => state.categories[g].reduce((s,c)=>s+(parseFloat(m[g][c.id])||0),0);
function totalsFor(m){
  m = eff(m);
  const totalEntree = sumG(m,'entreeAnnexe'), totalSalaire = (m.salaire.nassim||0)+(m.salaire.roxane||0);
  const totalCF = sumG(m,'chargesFixes'), totalCV = sumG(m,'chargesVariables');
  const revenus = totalSalaire + totalEntree, charges = totalCF + totalCV;
  const epargne = (m.epargne.nassim||0)+(m.epargne.roxane||0);
  return {totalEntree, totalSalaire, totalCF, totalCV, revenus, charges, epargne, reste: revenus - charges - epargne};
}
/* Charges récurrentes */
const GROUPS = ['entreeAnnexe','chargesFixes','chargesVariables'];
function hasRec(){ const c=state.categories; return (c.salaryRec.nassim>0||c.salaryRec.roxane>0) || GROUPS.some(g=>c[g].some(x=>x.rec>0)); }
function applyRecTo(m){
  let ch = false; const c = state.categories;
  ['nassim','roxane'].forEach(k=>{ if(!m.salaire[k] && c.salaryRec[k]>0){ m.salaire[k]=c.salaryRec[k]; ch=true; } });
  GROUPS.forEach(g=>c[g].forEach(x=>{ if(!m[g][x.id] && x.rec>0){ m[g][x.id]=x.rec; ch=true; } }));
  return ch;
}
function isUntouched(m){
  return !m._u && m.statut==='L' && !m.salaire.nassim && !m.salaire.roxane && !sumObj(m.entreeAnnexe) && !sumObj(m.chargesFixes) && !sumObj(m.chargesVariables) && !sumObj(m.epargne);
}
function autoRecurring(){
  if(!hasRec()) return false;
  let ch = false;
  state.months.forEach(m=>{ if(m.mois>=todayKey() && isUntouched(m) && applyRecTo(m)) ch = true; });
  if(ch) persist();
  return ch;
}
function applyRecFuture(){
  let n = 0;
  state.months.forEach(m=>{ if(m.mois>=todayKey() && m.statut!=='O' && applyRecTo(m)) n++; });
  if(n) persist();
  return n;
}
const sortedMonths = () => state.months.slice().sort((a,b)=>a.mois.localeCompare(b.mois));
function statutInfo(s){
  if(s==='O') return {cls:'done', label:'Clôturé'};
  if(s==='J') return {cls:'progress', label:'En cours'};
  return {cls:'todo', label:'À traiter'};
}
/* Épargne commune = somme des deux contributions. Le solde de départ (goal.startN / startR) permet de corriger le cumul. */
function epargneStart(){ const g = state.goal, n = g.startN||0, r = g.startR||0; return {nassim:n, roxane:r, both:n+r}; }
function epargneSeries(){
  let run = epargneStart();
  return sortedMonths().map(m=>{
    const n = m.epargne.nassim||0, r = m.epargne.roxane||0;
    run = {nassim:run.nassim+n, roxane:run.roxane+r, both:run.both+n+r};
    return {mois:m.mois, contrib:{nassim:n, roxane:r, both:n+r}, cumul:{...run}};
  });
}
/* Dernier mois avec un versement : la prévision s'arrête là, pas au dernier mois du calendrier */
function lastActive(ser){ for(let i=ser.length-1;i>=0;i--){ const c=ser[i].contrib; if(c.nassim||c.roxane) return ser[i]; } return null; }
function cumulAt(key){
  let r = epargneStart();
  epargneSeries().forEach(s=>{ if(s.mois<=key) r = s.cumul; });
  return r;
}
const years = () => Array.from(new Set(state.months.map(m=>m.mois.slice(0,4)))).sort();
const periodMonths = () => sortedMonths().filter(m=> ui.year==='all' || m.mois.startsWith(ui.year));
const periodLabel = () => ui.year==='all' ? 'Toutes les années' : 'Année '+ui.year;
function pickMonth(){
  const ms = sortedMonths(); if(!ms.length) return null;
  if(ui.month && ms.some(m=>m.mois===ui.month)) return ui.month;
  if(ms.some(m=>m.mois===todayKey())) return todayKey();
  const withData = ms.filter(m=>totalsFor(m).totalSalaire>0);

  const close = ()=>{ ov.remove(); document.removeEventListener('keydown', onKey); if(opts.onClose) opts.onClose(); };

  if(!opts.locked) ov.addEventListener('mousedown', e=>{ if(e.target===ov) close(); });

function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function scaleFor(values){
  const mx = Math.max(0,...values), mn = Math.min(0,...values);
  if(mx===0 && mn===0) return {lo:0, hi:1, ticks:[0,1]};
  const step = niceStep((mx-mn)/4), lo = Math.floor(mn/step)*step, hi = Math.ceil(mx/step)*step, ticks = [];
  for(let v=lo; v<=hi+step/2; v+=step) ticks.push(v);
  return {lo, hi, ticks};
}
function axes(W,H,pad,sc,labels,xFor){
  const ih = H-pad.t-pad.b, y = v => pad.t + ih*(sc.hi-v)/(sc.hi-sc.lo);
  let g = '';
  sc.ticks.forEach(t=>{
    g += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" class="${t===0?'gl0':'gl'}" stroke-width="1"/>`;
    g += `<text x="${pad.l-8}" y="${y(t)+4}" text-anchor="end" class="tk" font-size="11">${fmtC(t)}</text>`;
  });
  const n = labels.length, every = Math.max(1, Math.ceil(n*(W<480?38:44)/(W-pad.l-pad.r)));
  labels.forEach((l,i)=>{ if(i%every===0) g += `<text x="${xFor(i)}" y="${H-8}" text-anchor="middle" class="tk" font-size="11">${esc(l)}</text>`; });
  return {g, y};
}
const legendHtml = items => `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;

function barsChart(W, labels, tips, series){
  const H = 240, pad = {l:46, r:8, t:12, b:30}, iw = W-pad.l-pad.r, n = labels.length;
  const sc = scaleFor(series.flatMap(s=>s.values)), gw = iw/n, xc = i => pad.l+gw*i+gw/2;
  const {g, y} = axes(W,H,pad,sc,labels,xc);
  const bw = Math.max(3, Math.min(20, gw*0.8/series.length)), total = bw*series.length;
  let bars = '', hits = '';
  labels.forEach((_,i)=>{
    series.forEach((s,k)=>{
      const v = s.values[i], x = xc(i)-total/2+k*bw, y0 = y(0), y1 = y(v);
      bars += `<rect x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${Math.max(0,Math.abs(y1-y0)).toFixed(1)}" rx="1.5" fill="${s.color}"/>`;
    });
    hits += `<rect x="${(pad.l+gw*i).toFixed(1)}" y="${pad.t}" width="${gw.toFixed(1)}" height="${H-pad.t-pad.b}" fill="transparent"><title>${esc(tips[i])}</title></rect>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique en barres">${g}${bars}${hits}</svg>${legendHtml(series)}`;
}
function linesChart(W, labels, tips, series, projFrom){
  const H = 240, pad = {l:46, r:12, t:12, b:30}, iw = W-pad.l-pad.r, n = labels.length;
  const sc = scaleFor(series.flatMap(s=>s.values)), gw = iw/n, xc = i => pad.l+gw*i+gw/2;
  const {g, y} = axes(W,H,pad,sc,labels,xc);
  let paths = '', hits = '';
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>[xc(i),y(v)]), k = projFrom==null ? n : projFrom;
    const seg = (a,b) => pts.slice(a,b).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    if(k>0) paths += `<path d="${seg(0,k)}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(k<n) paths += `<path d="${seg(Math.max(0,k-1),n)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="5 4" opacity=".85"/>`;
    const li = Math.min(k,n)-1; if(li>=0) paths += `<circle cx="${pts[li][0].toFixed(1)}" cy="${pts[li][1].toFixed(1)}" r="3.5" fill="${s.color}"/>`;
  });
  labels.forEach((_,i)=>{ hits += `<rect x="${(pad.l+gw*i).toFixed(1)}" y="${pad.t}" width="${gw.toFixed(1)}" height="${H-pad.t-pad.b}" fill="transparent"><title>${esc(tips[i])}</title></rect>`; });
  const note = (projFrom!=null && projFrom<n) ? `<div class="help">Trait plein : jusqu'à ce mois. Pointillés : mois planifiés (prévisionnel).</div>` : '';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes d'évolution">${g}${paths}${hits}</svg>${legendHtml(series)}${note}`;
}
function donutChart(W, items){
  const data = items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  const total = sum(data,i=>i.value);
  if(!total) return '<div class="empty">Aucune charge fixe enregistrée pour ce mois.</div>';
  const S = 176, c = S/2, R = 80, r = 52; let ang = -Math.PI/2, paths = '';
  const pt = (rad,a) => [c+rad*Math.cos(a), c+rad*Math.sin(a)];
  data.forEach((d,idx)=>{
    const col = PALETTE[idx%PALETTE.length], frac = d.value/total;
    if(frac>0.9999){ paths += `<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`; return; }
    const a1 = ang, a2 = ang+frac*2*Math.PI, large = frac>0.5?1:0; ang = a2;
    const [x1,y1]=pt(R,a1), [x2,y2]=pt(R,a2), [x3,y3]=pt(r,a2), [x4,y4]=pt(r,a1);
    paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${r},${r} 0 ${large} 0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${col}" style="stroke:var(--surface)" stroke-width="1.5"><title>${esc(d.label)} : ${fmt(d.value)}</title></path>`;
  });
  const legend = data.map((d,idx)=>`<div class="li"><span class="sw" style="background:${PALETTE[idx%PALETTE.length]}"></span><span class="nm">${esc(d.label)}</span><span class="num">${fmt(d.value)}</span><span class="pc num">${Math.round(d.value/total*100)} %</span></div>`).join('');
  return `<div class="donut-wrap"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="Répartition des charges fixes">${paths}
    <text x="${c}" y="${c-2}" text-anchor="middle" class="tk" font-size="11">Total</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" font-size="14" font-weight="650" style="fill:var(--ink)">${fmtC(total)}</text></svg>
    <div class="donut-legend">${legend}</div></div>`;
}

      <text x="${(bx+bw/2).toFixed(1)}" y="${(by+31).toFixed(1)}" text-anchor="middle" font-size="10.5" style="fill:var(--ink-3)">${esc(labels[n-1])}</text></g>${hits}</svg>`;
}
function dashDonut(rows, total){
  const S = 190, c = S/2, R = 90, r = 64; let ang = -Math.PI/2, paths = '';
  const pt = (rad,a) => [c+rad*Math.cos(a), c+rad*Math.sin(a)];
  rows.forEach((d,i)=>{
    const col = d.col||PALETTE[i%PALETTE.length], frac = d.s/total;
    if(frac>0.9999){ paths += `<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}"/>`; return; }
    const a1 = ang, a2 = ang+frac*2*Math.PI, lg = frac>0.5?1:0; ang = a2;
    const [x1,y1]=pt(R,a1),[x2,y2]=pt(R,a2),[x3,y3]=pt(r,a2),[x4,y4]=pt(r,a1);
    paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${r},${r} 0 ${lg} 0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" fill="${col}" style="stroke:var(--surface)" stroke-width="2"><title>${esc(d.label)} : ${fmt(d.s)}</title></path>`;
  });
  return `<svg class="donut" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img" aria-label="Répartition des dépenses">${paths}
    <text x="${c}" y="${c-2}" text-anchor="middle" font-size="19" font-weight="650" style="fill:var(--ink)">${fmtN(total)}</text>
    <text x="${c}" y="${c+17}" text-anchor="middle" font-size="12" style="fill:var(--ink-3)">FCFA</text></svg>`;
}

    <div class="help" style="margin-top:10px"><a class="lnk" href="#" onclick="openCategoryManager();return false">Définir les budgets ›</a></div></div></section>`;

  /* Contributions du foyer */
  const sn = m.salaire.nassim||0, sr = m.salaire.roxane||0, st = sn+sr;
  const person = (nm, v, ep, cls, init) => `<div class="pc-row"><span class="av ${cls}">${init}</span><div class="pc-b"><div class="pc-t"><b>${nm}</b><span class="num">${fmtN(v)} <small>FCFA</small></span></div>

      return `<div class="go">${o.img?`<img class="gimg" src="${o.img}" alt="">`:`<span class="gic" style="background:${o.col}22;color:${o.col}">${dic(o.ic)}</span>`}<div class="gb"><div class="gt"><b>${esc(o.label)}${o.rank===1?' <span class="prio">Priorité</span>':''}</b><span class="num" style="color:${o.col}">${p} %</span></div>

      : `<div class="empty">Aucun objectif.<br><a class="lnk" href="#" onclick="editGoal();return false">Définir un objectif</a></div>`}</div></section>`;

/* ---------- Comptes ---------- */
const ACC_KINDS = {courant:{l:'Compte courant',c:'#4FA3FF'}, epargne:{l:'Compte épargne',c:'#34D399'}, mobile:{l:'Mobile Money',c:'#FB923C'}, invest:{l:'Investissement',c:'#A78BFA'}, autre:{l:'Autre',c:'#8EA3B0'}};
const accKind = a => ACC_KINDS[a.kind] || ACC_KINDS.autre;
const accBal = (a, upto) => (a.start||0) + sum(a.moves||[], x=>(!upto || x.date<=upto) ? x.amount : 0);
const accTotal = upto => sum(state.accounts, a=>accBal(a,upto));
const initials = s => (s||'?').trim().slice(0,2).toUpperCase();
function prevMois(k){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function accSeries(range, mk){
  let from = mk;
  if(range==='all'){
    const ds = []; state.accounts.forEach(a=>(a.moves||[]).forEach(x=>{ if(x.date) ds.push(x.date.slice(0,7)); }));
    if(ds.length){ from = ds.sort()[0]; if(from>mk) from = mk; }
    else for(let i=1;i<6;i++) from = prevMois(from);
  } else for(let i=1;i<+range;i++) from = prevMois(from);
  const out = []; let k = from, guard = 0;
  while(k<=mk && guard++<120){ out.push({mois:k, total:accTotal(k+'-31')}); k = nextMois(k); }
  return out;
}
function accountFields(a){
  return [{id:'n',label:'Nom du compte',value:a?a.name:'',placeholder:'Ex. Compte principal',required:true},
    {id:'b',label:'Banque ou opérateur',value:a?a.bank:'',placeholder:'Ex. Ecobank, BOA, Orange Money'},
    {id:'k',label:'Type',type:'select',value:a?a.kind:'courant',options:Object.entries(ACC_KINDS).map(([v,o])=>({v,l:o.l}))},
    {id:'s',label:'Solde de départ (F)',type:'number',value:a?a.start:0,help:'Le solde d’aujourd’hui. Les versements et retraits que vous ajoutez ensuite s’y cumulent.'}];
}
function addAccount(){
  formModal({title:'Nouveau compte', fields:accountFields(null), submit:'Créer', onSubmit:v=>{
    if(!v.n.trim()){ toast('Donnez un nom au compte.', true); return false; }
    state.accounts.push({id:'a'+uid(), name:v.n.trim(), bank:v.b.trim(), kind:v.k, start:parseFloat(v.s)||0, moves:[]}); persist(); render(); toast('Compte ajouté'); }});

function editAccount(id){
  const a = state.accounts.find(x=>x.id===id); if(!a) return;

function deleteAccount(id){
  const a = state.accounts.find(x=>x.id===id); if(!a) return;

function resizeImage(file, maxW=720){
  return new Promise((res,rej)=>{
    const rd = new FileReader();
    rd.onerror = ()=>rej(new Error('lecture'));
    rd.onload = ()=>{ const im = new Image(); im.onerror = ()=>rej(new Error('image'));
      im.onload = ()=>{ const r = Math.min(1, maxW/im.width), c = document.createElement('canvas'); c.width = Math.round(im.width*r); c.height = Math.round(im.height*r);
        const x = c.getContext('2d'); x.fillStyle = '#0B1824'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.78)); };
      im.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

/* ---------- Projets : financement par l'épargne ou par un compte, chantier, simulateur ---------- */
const PROJ_RE = /voiture|véhicule|vehicule|automobile|\bauto\b|4x4/i;
function projOrder(){
  return state.projects.map((p,i)=>({p, k: p.prio>0 ? p.prio : (PROJ_RE.test(p.title) ? 0.5 : 1000+i)})).sort((a,b)=>a.k-b.k).map(x=>x.p);
}
const projTarget = p => { const s = sum(p.items,i=>i.amount); return s>0 ? s : (p.budget||0); };
function avgSaving(mk){
  const ser = epargneSeries().filter(s=>s.mois<=mk && s.contrib.both>0).slice(-3);
  return ser.length ? sum(ser,s=>s.contrib.both)/ser.length : 0;
}
function accAvgIn(a, mk){
  const by = {}; (a.moves||[]).forEach(x=>{ if(x.amount>0 && x.date && x.date.slice(0,7)<=mk){ const k = x.date.slice(0,7); by[k] = (by[k]||0)+x.amount; } });
  const ks = Object.keys(by).sort().slice(-3); return ks.length ? sum(ks,k=>by[k])/ks.length : 0;
}
function etaFrom(mk, remaining, perMonth){
  if(remaining<=0 || perMonth<=0) return null;
  let k = mk; for(let n=Math.min(600,Math.ceil(remaining/perMonth)); n>0; n--) k = nextMois(k); return k;
}
/* L'épargne commune finance les projets dans l'ordre de priorité. Un projet lié à un compte est financé par le solde de ce compte. */
function projFunding(mk, opts){
  const P0 = Math.max(0, cumulAt(mk).both), avg = (opts && opts.monthly!=null) ? opts.monthly : avgSaving(mk), out = {};
  let pool = P0, need = 0;
  projOrder().forEach((p,i)=>{
    const t = projTarget(p), acc = p.acc ? state.accounts.find(a=>a.id===p.acc) : null;
    if(acc){
      const bal = Math.max(0, accBal(acc, mk+'-31')), f = Math.min(bal, t);
      out[p.id] = {rank:i+1, target:t, funded:f, pct:t>0?Math.round(f/t*100):0, eta:t>0?etaFrom(mk, t-f, accAvgIn(acc,mk)):null, source:'compte', accName:acc.name};
      return;
    }
    const f = Math.min(pool, t); pool -= f; need += t;
    out[p.id] = {rank:i+1, target:t, funded:f, pct:t>0?Math.round(f/t*100):0, eta:(t>0 && need>P0 && avg>0)?etaFrom(mk, need-P0, avg):null, source:'épargne'};
  });
  return out;
}
function makeFirst(p){ const ord = projOrder().filter(x=>x!==p); [p].concat(ord).forEach((x,k)=>{ x.prio = k+1; }); }
function moveProject(id, d){
  const ord = projOrder(), i = ord.findIndex(p=>p.id===id), j = i+d; if(i<0||j<0||j>=ord.length) return;
  [ord[i],ord[j]] = [ord[j],ord[i]]; ord.forEach((p,k)=>{ p.prio = k+1; }); persist(); render();
}
const etaText = f => f.target<=0 ? 'Ajoutez un budget pour suivre ce projet' : f.pct>=100 ? (f.source==='compte'?'Financé par le compte « '+f.accName+' »':'Financé par l’épargne') : f.eta ? 'Financé vers '+monthLong(f.eta)+(f.source==='compte'?' (compte « '+f.accName+' »)':'') : 'Pas assez de versements récents pour estimer une date';

function simHtml(monthly, mk){
  const F = projFunding(mk, {monthly}), ord = projOrder();
  if(!ord.length) return '<div class="empty">Créez un projet pour lancer une simulation.</div>';
  const pool = ord.filter(p=>F[p.id].source==='épargne' && F[p.id].target>0 && F[p.id].pct<100);
  const last = pool.map(p=>F[p.id].eta).filter(Boolean).sort().pop();
  const head = !pool.length ? 'Tous les projets financés par l’épargne sont déjà couverts.' : monthly<=0 ? 'Avec 0 F par mois, aucun projet supplémentaire n’est financé.' : last ? 'Tous les projets seront financés vers <b>'+monthLong(last)+'</b>.' : '';
  return `<div class="help" style="margin:0 0 8px">${head}</div>` + ord.map(p=>{ const f = F[p.id];
    const txt = f.target<=0 ? 'Pas de budget' : f.pct>=100 ? 'Déjà financé' : f.eta ? 'Financé vers '+monthLong(f.eta) : (f.source==='compte'?'Selon les versements du compte':'Aucune date possible');
    return `<div class="simrow"><span class="rk ${f.rank===1?'first':''}">${f.rank}</span><b>${esc(p.title)}</b><span class="num">${fmtN(f.funded)} / ${fmtN(f.target)} F</span><span class="simeta">${txt}</span></div>`; }).join('');

  const summary = `<section class="panel"><div class="panel-head"><div><h2>Financement des projets</h2><div class="sub">Votre épargne commune (${fmt(pool)}${avg>0?', environ '+fmt(avg)+' par mois':''}) finance les projets dans l’ordre de priorité. Un projet lié à un compte utilise le solde de ce compte.</div></div>

      ${p.img?`<img class="gimg" src="${p.img}" alt="">`:''}<div class="pr-b"><div class="gt"><b>${esc(p.title)}</b><span class="num">${f.pct} %</span></div>
      <div class="bar"><i class="${f.pct>=100?'ok':''}" style="width:${f.pct}%"></i></div>
      <div class="help" style="margin:5px 0 0">${fmtN(f.funded)} / ${fmtN(f.target)} F · ${etaText(f)}</div></div></div>`; }).join('') : '<div class="empty">Aucun projet pour le moment. Créez « Voiture », « Maison »… pour les suivre.</div>'}</div></section>`;
  const simV = Math.round(ui.sim!=null ? ui.sim : avg);
  const sim = ord.length ? `<section class="panel"><div class="panel-head"><div><h2>Simulateur « et si »</h2><div class="sub">Changez le montant épargné chaque mois : les dates de financement se recalculent.</div></div></div><div class="panel-body">

    <div id="simout">${simHtml(simV, mk)}</div></div></section>` : '';
  $('#main').innerHTML = summary + sim + ord.map((p,idx)=>{

/* ---------- Alertes d'accueil ---------- */
function alertsFor(mk){
  const m = state.months.find(x=>x.mois===mk), out = []; if(!m) return out;
  budgetRows(m).forEach(r=>{ if(r.b>0){ const p = r.s/r.b*100;
    if(r.s>r.b) out.push({lvl:'over', t:`${r.label} : budget dépassé de ${fmt(r.s-r.b)} (budget ${fmt(r.b)})`});
    else if(p>=80 && p<100) out.push({lvl:'warn', t:`${r.label} : ${Math.round(p)} % du budget utilisé (${fmt(r.s)} sur ${fmt(r.b)})`}); } });
  if(mk===todayKey()){ const now = new Date().getDate();
    state.categories.chargesFixes.forEach(c=>{ if(c.day>0 && (c.rec>0||c.budget>0)){ const d = c.day-now;
      if(d>=0 && d<=3) out.push({lvl:'due', t:`${c.label} à payer ${d===0?"aujourd'hui":d===1?'demain':'dans '+d+' jours'} (le ${c.day})${(c.rec||c.budget)?' · '+fmt(c.rec||c.budget):''}`}); } }); }
  const o = {over:0, due:1, warn:2}; return out.sort((a,b)=>o[a.lvl]-o[b.lvl]);
}

function bilanYear(){
  const ys = years(), cur = String(new Date().getFullYear());
  return ui.year!=='all' && ys.includes(ui.year) ? ui.year : (ys.includes(cur) ? cur : ys[ys.length-1]);
}
function bilanData(yr){
  const all = sortedMonths().filter(m=>m.mois.startsWith(yr)), rows = all.map(m=>({m, t:totalsFor(m)})).filter(r=>r.t.revenus>0||r.t.charges>0||r.t.epargne!==0);
  const cats = {};
  rows.forEach(r=>{ const em = eff(r.m); ['chargesFixes','chargesVariables'].forEach(g=>state.categories[g].forEach(c=>{ const v = parseFloat(em[g][c.id])||0; if(v>0) cats[g+c.id] = {label:c.label, v:(cats[g+c.id]?cats[g+c.id].v:0)+v}; })); });
  return {rows, cats:Object.values(cats).sort((a,b)=>b.v-a.v)};
}

      <div class="sect"><h4>Épargne versée ce mois-ci</h4><div class="fgrid">${num('f_en','Nassim',m.epargne.nassim)}${num('f_er','Roxane',m.epargne.roxane)}</div><div class="livetotal"><span>Commune (somme des deux)</span><b id="f_ebv">0 F</b></div></div>

      <div class="actions">${existing?`<button type="button" class="btn danger left" id="delM">Supprimer ce mois</button>`:''}<button type="button" class="btn secondary" data-close>Annuler</button><button type="submit" class="btn">Enregistrer</button></div>

    const r = val('f_sn')+val('f_sr')+gsum('entreeAnnexe')+xs('entreeAnnexe')-gsum('chargesFixes')-xs('chargesFixes')-gsum('chargesVariables')-xs('chargesVariables')-val('f_en')-val('f_er'); const el=mo.q('#live'); el.textContent=fmt(r); mo.q('#f_ebv').textContent=fmt(val('f_en')+val('f_er')); el.className = r<0?'neg':'pos'; };

    const upd = {mois:newMois, statut:mo.q('#f_statut').value, _u:0,

    state.months = state.months.filter(x=>x.mois!==m.mois); state.months.push(upd);
    ui.month = newMois; persist(); mo.close(); render(); toast('Enregistré');

        <button class="btn" style="margin-left:auto" onclick="openQuickAdd()">Ajouter</button></div>
      <div class="hero-label">Dépenses notées ce mois-ci</div>
      <div class="hero-num" style="font-size:40px">${fmt(totOut)}</div>
      <div class="hero-sub">${outs.length} dépense${outs.length>1?'s':''}${totIn?', '+fmt(totIn)+' de revenus ajoutés':''}</div>
    </section>
    <div class="grid2">
      ${panel('Par catégorie', cats.length ? cats.map(c=>`<button class="bud catbtn ${ui.cat===c.k?'sel':''}" onclick="setCat('${c.k}')"><div class="nm">${esc(c.label)}</div><div class="bar"><i style="width:${(c.v/maxV*100).toFixed(1)}%"></i></div><div class="amt num">${fmt(c.v)}<small>${totOut?Math.round(c.v/totOut*100):0} %</small></div></button>`).join('') : '<div class="empty">Aucune dépense ce mois-ci. Touchez « Ajouter » pour noter la première.</div>',
        ui.cat!=='all' ? `<button class="btn secondary sm" onclick="setCat('all')">Tout afficher</button>` : '', 'Touchez une catégorie pour filtrer')}
      ${panel('Opérations', shown.length ? list : '<div class="empty">Rien à afficher pour ce mois.</div>', '', 'Touchez une ligne pour la modifier')}
    </div>`;
}
function setCat(k){ ui.cat = (ui.cat===k) ? 'all' : k; render(); }

/* ---------- Projets ---------- */
function deleteProject(id){
  const p = state.projects.find(x=>x.id===id);
  confirmModal({title:'Supprimer ce projet ?', message:`« ${p.title} » et ses ${p.items.length} lignes de budget seront supprimés.`, confirm:'Supprimer', onConfirm:()=>{ state.projects = state.projects.filter(x=>x.id!==id); persist(); render(); toast('Projet supprimé'); }});
}
function addItem(ev, pid){
  ev.preventDefault();
  const l = $('#nl-'+pid).value.trim(), a = parseFloat($('#na-'+pid).value)||0;
  if(!l){ toast('Indiquez un libellé.', true); return false; }
  state.projects.find(x=>x.id===pid).items.push({id:'i'+uid(), label:l, amount:a, checked:false}); persist(); render(); return false;
}
function toggleItem(pid,iid){ const i = state.projects.find(x=>x.id===pid).items.find(x=>x.id===iid); i.checked = !i.checked; persist(); render(); }
function editItem(pid,iid){
  const i = state.projects.find(x=>x.id===pid).items.find(x=>x.id===iid);
  formModal({title:'Modifier la ligne', fields:[{id:'l',label:'Libellé',value:i.label},{id:'a',label:'Montant (F)',type:'number',value:i.amount}],
    onSubmit:v=>{ i.label = v.l.trim()||i.label; i.amount = parseFloat(v.a)||0; persist(); render(); toast('Enregistré'); }});
}
function deleteItem(pid,iid){ const p = state.projects.find(x=>x.id===pid); p.items = p.items.filter(x=>x.id!==iid); persist(); render(); }

/* ============================================================
   PARAMÈTRES : profil, synchronisation, sauvegarde
   ============================================================ */
function pickUser(locked, after){
  const mo = openModal(`<h3>Qui utilise cet appareil ?</h3><p class="sub">Cela permet d'indiquer qui a modifié les données en dernier.</p>
    <div class="pickuser"><button data-u="Nassim">Nassim</button><button data-u="Roxane">Roxane</button></div>`, {locked});
  mo.qa('[data-u]').forEach(b=>b.onclick=()=>{ currentUser=b.dataset.u; try{localStorage.setItem(LS.user,currentUser);}catch(e){} mo.close(); renderChrome(); if(after) after(); });
}
function afterLogin(){
  const em = (auth && auth.email || '').toLowerCase(), u = /roxane/.test(em) ? 'Roxane' : /nassim/.test(em) ? 'Nassim' : null;
  if(u){ currentUser = u; try{ localStorage.setItem(LS.user, u); }catch(e){} }
  toast('Connecté'); renderChrome();
  if(!currentUser) pickUser(true);
}
function openLogin(){
  if(document.getElementById('loginForm')) return;
  if(!keyOk()){ toast('La synchronisation doit encore être configurée (clé API manquante).', true); return; }
  const ARCS = `<svg class="lg-arcs" viewBox="0 0 832 430" preserveAspectRatio="xMidYMin slice" aria-hidden="true" fill="none">
      <g stroke="#8FB0C6" stroke-width="1.2" stroke-dasharray="3 5" opacity=".9">
        <path d="M76 257 Q150 170 229 204"/><path d="M229 204 Q390 120 555 214"/><path d="M229 204 Q320 230 388 270"/><path d="M555 214 Q680 150 783 187"/><path d="M555 214 Q660 215 728 277"/><path d="M76 257 Q100 330 159 388"/><path d="M728 277 Q700 350 652 402"/></g>
      <g fill="#4FA3FF" opacity=".85"><circle cx="76" cy="257" r="3.5"/><circle cx="229" cy="204" r="3.5"/><circle cx="388" cy="270" r="3"/><circle cx="555" cy="214" r="3.5"/><circle cx="728" cy="277" r="3.5"/><circle cx="783" cy="187" r="3.5"/><circle cx="159" cy="388" r="3" opacity=".6"/><circle cx="652" cy="402" r="3" opacity=".6"/></g>
      <g transform="translate(628 226) rotate(-18)" fill="#6F8CA3" opacity=".9"><path d="M-14 0 L10 -3 L-2 -12 L3 -12 L20 -3 L26 -3 L26 3 L20 3 L3 12 L-2 12 L10 3 L-14 0Z"/></g></svg>`;
  const SKY = `<svg class="lg-sky" viewBox="0 0 832 230" preserveAspectRatio="xMidYMax meet" aria-hidden="true" fill="none" stroke="#9DB5C7" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 208 H832" stroke-dasharray="0"/><path d="M0 222 h40 M70 222 h40 M140 222 h40 M210 222 h40 M280 222 h40 M350 222 h40 M420 222 h40 M490 222 h40 M560 222 h40 M630 222 h40 M700 222 h40 M770 222 h40" opacity=".5"/>
      <path d="M38 208 V120 L118 70 L198 120 V208"/><path d="M38 160 H198"/><rect x="58" y="128" width="22" height="22"/><rect x="108" y="128" width="22" height="22"/><rect x="156" y="128" width="22" height="22"/>
      <rect x="58" y="176" width="22" height="32"/><rect x="108" y="172" width="22" height="22"/><rect x="156" y="172" width="22" height="22"/><rect x="104" y="96" width="28" height="14" stroke="#4FA3FF" opacity=".9"/>
      <path d="M262 208 V190 Q262 182 270 180 L292 174 Q302 158 320 158 H352 Q368 158 378 172 L392 180 Q404 182 404 194 V208"/><path d="M308 176 H350 M286 176 L292 174"/><circle cx="294" cy="208" r="12" fill="#0B1824"/><circle cx="374" cy="208" r="12" fill="#0B1824"/><path d="M262 208 H282 M306 208 H362 M386 208 H404"/>
      <g stroke="#4FA3FF" opacity=".9"><ellipse cx="472" cy="196" rx="28" ry="8"/><ellipse cx="472" cy="186" rx="28" ry="8"/><ellipse cx="472" cy="176" rx="28" ry="8"/><path d="M444 176 V196 M500 176 V196"/></g>
      <ellipse cx="540" cy="198" rx="24" ry="7"/><ellipse cx="540" cy="189" rx="24" ry="7"/><path d="M516 189 V198 M564 189 V198"/><path d="M516 198 V208 M564 198 V208" opacity="0"/>
      <rect x="620" y="170" width="22" height="38"/><rect x="652" y="144" width="22" height="64"/><rect x="684" y="112" width="22" height="96"/><rect x="716" y="80" width="22" height="128" stroke="#4FA3FF"/>
      <path d="M616 150 L660 118 L690 132 L738 62" stroke="#4FA3FF" opacity=".9"/><path d="M724 62 H738 V76" stroke="#4FA3FF" opacity=".9"/></svg>`;
  const mo = openModal(`<section class="lg-left">${ARCS}
      <div class="lg-brand"><img class="lg-logo" src="${LOGO}" alt=""><div class="lg-word">SALEH<span>WEALTH</span></div><i class="lg-bar"></i><div class="lg-tag">Building wealth together</div></div>
      ${SKY}<div class="lg-foot"><span>ÉPARGNE <b>•</b> PROJETS <b>•</b> PATRIMOINE</span><em>conçu par RH</em></div></section>
    <section class="lg-right"><div class="lg-form">
      <h3>Connexion</h3><p class="lg-sub">Accédez aux finances du foyer.</p>
      <button type="button" class="btn secondary lg" id="l_google">Continuer avec Google</button>
      <div class="lg-or"><span>ou</span></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="l_mail">Identifiant (e-mail)</label><input id="l_mail" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="prenom@exemple.com"></div>
        <div class="field"><label for="l_pw">Mot de passe</label><input id="l_pw" type="password" autocomplete="current-password"></div>
        <div class="help" id="l_err" role="alert" style="color:var(--neg);min-height:18px"></div>
        <button type="submit" class="btn lg" id="l_go">Se connecter</button>
      </form>
    </div></section>`, {full:true, locked:true});
  mo.q('#l_google').onclick = async ()=>{
    const err = mo.q('#l_err'), b = mo.q('#l_google'); err.textContent = ''; b.disabled = true; b.textContent = 'Connexion Google…';
    try{ await googleSignIn(); mo.close(); afterLogin(); await sync(); render(); }
    catch(ex){ b.disabled = false; b.textContent = 'Continuer avec Google'; err.textContent = GOOGLE_ERR[ex.code] || (ex.message==='load' ? 'Impossible de charger Google. Vérifiez le réseau.' : 'Erreur Google : '+(ex.code||ex.message||ex)); }
  };
  mo.q('#l_mail').focus();
  mo.q('#loginForm').onsubmit = async e=>{
    e.preventDefault(); const mail = mo.q('#l_mail').value.trim(), pw = mo.q('#l_pw').value, err = mo.q('#l_err');
    if(!mail || !pw){ err.textContent = 'Saisissez votre e-mail et votre mot de passe.'; return; }
    const btn = mo.q('#l_go'); btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
    try{
      await signIn(mail, pw); mo.close(); afterLogin(); await sync(); render();
    }catch(ex){
      btn.disabled = false; btn.textContent = 'Se connecter';
      err.textContent = AUTH_ERR[ex.fb] || (ex.name==='AbortError'||ex instanceof TypeError ? 'Connexion impossible. Vérifiez le réseau.' : (ex.fb==='API_KEY_INVALID' || /API key/i.test(ex.message) ? 'Clé API Firebase invalide.' : 'Erreur : '+(ex.message||ex)));
    }
  };
}
function openSettings(){
  const mo = openModal(`<h3>Paramètres</h3><p class="sub">Profil, compte et sauvegarde.</p>
    <div class="sect"><h4>Profil</h4><div class="field"><label for="s_user">Cet appareil est utilisé par</label><select id="s_user"><option value="">Non défini</option><option ${currentUser==='Nassim'?'selected':''}>Nassim</option><option ${currentUser==='Roxane'?'selected':''}>Roxane</option></select></div></div>
    <div class="sect"><h4>Compte et partage</h4>
      ${auth ? `<p class="help" style="margin:0 0 10px">Connecté : <b>${esc(auth.email)}</b>. Vos données sont partagées avec les autres comptes du foyer.</p><div class="help" id="s_state" role="status">${esc(syncStatus.msg||'')}</div><div class="tools" style="margin-top:10px"><button class="btn secondary" id="s_now">Synchroniser maintenant</button><button class="btn danger" id="s_out">Se déconnecter</button></div>`
             : `<p class="help" style="margin:0 0 10px">Non connecté : les données restent sur cet appareil.</p><button class="btn" id="s_in">Se connecter</button>`}</div>
    <div class="sect"><h4>Sauvegarde</h4><div class="tools"><button class="btn secondary" id="s_exp">Exporter (JSON)</button><button class="btn secondary" id="s_imp">Importer…</button><input type="file" id="s_file" accept="application/json,.json" hidden></div>
      <div class="help">Une sauvegarde contient tous les mois, projets et catégories.</div></div>
    <div class="actions"><button class="btn secondary" data-close>Fermer</button><button class="btn" id="s_save">Enregistrer</button></div>`, {wide:true});
  mo.q('#s_exp').onclick = exportBackup;
  mo.q('#s_imp').onclick = ()=>mo.q('#s_file').click();
  mo.q('#s_file').onchange = e=>{ const f=e.target.files[0]; if(f) importBackup(f, mo); };
  const si = mo.q('#s_in'); if(si) si.onclick = ()=>{ mo.close(); openLogin(); };
  const so = mo.q('#s_out'); if(so) so.onclick = ()=>{ mo.close(); signOut(); };
  const sn = mo.q('#s_now'); if(sn) sn.onclick = async ()=>{ sn.disabled = true; await sync(); mo.q('#s_state').textContent = syncStatus.msg||''; sn.disabled = false; };
  mo.q('#s_save').onclick = ()=>{
    const u = mo.q('#s_user').value; if(u){ currentUser=u; try{localStorage.setItem(LS.user,u);}catch(e){} } else { currentUser=null; try{localStorage.removeItem(LS.user);}catch(e){} }
    renderChrome(); mo.close(); toast('Enregistré');
  };
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(pub(state),null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'finances-saleh-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importBackup(file, settingsModal){
  const rd = new FileReader();
  rd.onload = ()=>{
    let data; try{ data = JSON.parse(rd.result); }catch(e){ toast('Ce fichier n\'est pas une sauvegarde valide.', true); return; }
    if(!data || !asArray(data.months).length){ toast('Aucun mois trouvé dans ce fichier.', true); return; }
    confirmModal({title:'Remplacer les données actuelles ?', message:`La sauvegarde contient ${asArray(data.months).length} mois et ${asArray(data.projects).length} projets. Les données actuelles seront remplacées.`, confirm:'Remplacer', onConfirm:()=>{
      const imp = normalize(data); imp.tomb = state.tomb; imp.updatedAt = state.updatedAt;
      state = imp; persist(); if(settingsModal) settingsModal.close(); render(); toast('Sauvegarde importée');
    }});
  };
  rd.readAsText(file);
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function boot(){
  try{ currentUser = localStorage.getItem(LS.user) || null; }catch(e){}
  try{ Object.assign(ui, JSON.parse(localStorage.getItem(LS.ui)||'{}')); }catch(e){}
  if(!ui.year) ui.year = String(new Date().getFullYear());
  state = localLoad(); lastHash = snapshot(state);
  if(!localStorage.getItem(LS.state)) localSave();
  const NL = {synthese:"Vue d'ensemble"};
  const navHtml = '<div class="nsec">Gestion financière</div>' + TABS.map(([k,l])=>`<button data-tab="${k}" onclick="setTab('${k}')">${icon(k)}<span>${NL[k]||l}</span></button>`).join('')
    + `<div class="nsec">Paramètres</div><button onclick="openCategoryManager()">${dic('tag')}<span>Catégories</span></button><button onclick="openSettings()">${dic('cog')}<span>Paramètres</span></button>`;
  $('#nav').innerHTML = navHtml;
  const tbs = TABS.filter(t=>t[0]!=='bilan').map(([k,l])=>`<button data-tab="${k}" onclick="setTab('${k}')">${icon(k)}<span>${l}</span></button>`);
  tbs.splice(2,0,'<button class="plus" onclick="openQuickAdd()" aria-label="Nouvelle opération"><span class="fab">+</span></button>');
  $('#tabbar').innerHTML = tbs.join('');
  document.querySelectorAll('img.logo-img').forEach(i=>{ i.src = LOGO; });
  $('#yearSel').onchange = e=>{ ui.year = e.target.value; ui.month = null; saveUi(); render(); };
  render();
  if(autoRecurring()) render();
  if(!auth && keyOk()) openLogin(); else if(!currentUser) pickUser(true);
  sync();
  setInterval(()=>{ if(document.visibilityState==='visible') sync(); }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync(); });
  window.addEventListener('online', sync);
  let lastW = window.innerWidth, rt;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ if(window.innerWidth!==lastW){ lastW = window.innerWidth; render(); } }, 150); });
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
