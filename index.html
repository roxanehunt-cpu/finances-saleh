<style>
  :root{
    --ink:#0E1526;
    --ink-soft:#5B6472;
    --paper:#F6F7FA;
    --paper2:#EEF0F5;
    --gold:#4C5FF7;
    --gold-dark:#3B49D6;
    --teal:#12875A;
    --rust:#D6455A;
    --line:#E2E6ED;
    --white:#FFFFFF;
    --navy:#101A38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:980px;margin:0 auto;padding:0 0 60px;}

  /* HEADER */
  header.top{
    background:var(--navy);
    color:var(--paper);
    padding:28px 24px 60px;
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:28px;
    background:var(--paper);
    border-radius:18px 18px 0 0;
  }
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8B9EFF;
    font-weight:600;
  }
  .brand h1{
    font-family:'Inter',-apple-system,sans-serif;
    font-size:29px; margin:0; font-weight:800; letter-spacing:-0.02em;
  }
  .user-badge{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    padding:8px 14px; border-radius:999px; font-size:13px; cursor:pointer;
    color:var(--paper); white-space:nowrap;
  }
  .user-badge:hover{background:rgba(255,255,255,.14);}
  .user-dot{width:8px;height:8px;border-radius:50%;background:#7C8CFF;}

  /* HERO */
  .hero-card{
    position:relative; z-index:2; margin:0 24px -36px; 
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 26px;
    box-shadow:0 18px 40px -18px rgba(22,35,63,.45);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px;
  }
  .hero-figure .label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);}
  .hero-figure .value{
    font-family:'Inter',sans-serif; font-size:36px; font-weight:800; letter-spacing:-0.02em; color:var(--teal);
    font-variant-numeric:tabular-nums;
  }
  .hero-split{display:flex; gap:22px;}
  .hero-split .col{text-align:right;}
  .hero-split .col .name{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .hero-split .col .amt{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums;}

  /* NAV TABS */
  nav.tabs{
    display:flex; gap:6px; padding:52px 24px 0; background:var(--paper);
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:12px 8px 14px;
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    border-bottom:3px solid transparent; transition:.15s;
  }
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--gold);}
  nav.tabs button:hover{color:var(--ink);}

  main{background:var(--paper); padding:22px 24px 10px;}

  .divider{width:100%; height:14px; margin:6px 0 18px;}

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:22px 24px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(10,10,10,.04), 0 1px 8px rgba(10,10,10,.03);
  }
  .card h2{
    font-family:'Inter',sans-serif; font-size:15px; margin:0 0 16px; font-weight:700; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px; color:var(--ink);
  }
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:640px){ .grid3{grid-template-columns:1fr 1fr;} }
  .stat{
    background:var(--paper2); border-radius:10px; padding:16px 18px;
    border:1px solid transparent;
  }
  .stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}
  .stat .value{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  .stat.pos .value{color:var(--teal);}
  .stat.neg .value{color:var(--rust);}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px;}
  table{width:100%; min-width:560px; border-collapse:collapse; font-size:13.5px;}
  @media (max-width:640px){ table{font-size:12.5px;} th,td{padding:8px 8px;} }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line);
  }
  td{padding:10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;}
  tr.month-row{cursor:pointer;}
  tr.month-row:hover{background:var(--paper2);}
  .pill{
    display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600;
  }
  .pill.todo{background:#FCEAEC; color:var(--rust); border:1px solid #F6D2D8;}
  .pill.progress{background:#FFF6E0; color:#9C6B00; border:1px solid #F5E3AD;}
  .pill.done{background:#E6F4EC; color:var(--teal); border:1px solid #C8E9D6;}

  .btn{
    border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600;
    cursor:pointer; background:var(--navy); color:var(--white); transition:.15s;
  }
  .btn:hover{background:#1C2A52;}
  .btn.gold{background:var(--gold); color:#FFFFFF;}
  .btn.gold:hover{background:var(--gold-dark); color:#FFFFFF;}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--paper2);}
  .btn.small{padding:6px 12px; font-size:12px;}
  .btn.danger{background:transparent; color:var(--rust); border:1px solid #F0C7CD;}

  .row-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}

  /* FORM MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(22,35,63,.55); display:flex;
    align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--paper); border-radius:16px; max-width:560px; width:100%;
    padding:26px 26px 22px; margin-top:10px;
  }
  .modal h3{font-family:'Inter',sans-serif; margin:0 0 4px; font-size:19px; font-weight:700; letter-spacing:-0.01em;}
  .modal .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}
  fieldset{border:1px solid var(--line); border-radius:10px; margin:0 0 14px; padding:12px 14px 14px;}
  legend{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-dark); font-weight:700; padding:0 6px;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  input[type=text], input[type=number], input[type=month], input[type=date], select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:13.5px; background:var(--white); color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}

  /* PROJECTS */
  .project-card .p-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .progress-bar{height:8px; background:var(--paper2); border-radius:999px; overflow:hidden; margin:8px 0 4px;}
  .progress-fill{height:100%; background:var(--teal);}
  .item-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--teal);}
  .item-row .item-label{flex:1; font-size:13.5px;}
  .item-row .item-label.checked{text-decoration:line-through; color:var(--ink-soft);}
  .item-row .item-amt{font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-soft); min-width:90px; text-align:right;}
  .add-item-row{display:flex; gap:8px; margin-top:10px;}
  .add-item-row input{flex:1;}

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:14px;}
  footer.note{text-align:center; color:var(--ink-soft); font-size:11.5px; padding:16px 24px 0;}
</style>
</head>

/* ---------- Calculs ---------- */
function sumObj(o){ return Object.values(o||{}).reduce((s,v)=>s+(parseFloat(v)||0),0); }
function totalsFor(m){
  const s = m.salaire;
  const totalEntree = sumObj(m.entreeAnnexe);
  const totalSalaire = (s.nassim||0) + (s.roxane||0);
  const totalCF = sumObj(m.chargesFixes);
  const resteApresCF = totalSalaire - totalCF;
  const resteAvecEntree = resteApresCF + totalEntree;
  const totalCV = sumObj(m.chargesVariables);
  const resteFinal = resteAvecEntree - totalCV;
  return {totalEntree, totalSalaire, totalCF, resteApresCF, resteAvecEntree, totalCV, resteFinal};
}
function sortedMonths(){
  return months.slice().sort((a,b)=> a.mois.localeCompare(b.mois));
}
function statutInfo(s){
  if(s==='O') return {cls:'done', label:'Clôturé'};
  if(s==='J') return {cls:'progress', label:'En cours'};
  return {cls:'todo', label:'À traiter'};
}

/* ---------- Épargne (cumul automatique) ---------- */
function epargneSeries(){
  const sm = sortedMonths();
  let run = {nassim:0, roxane:0, both:0};
  return sm.map(m=>{
    const c = m.epargne||{nassim:0,roxane:0,both:0};
    run = {nassim:run.nassim+(c.nassim||0), roxane:run.roxane+(c.roxane||0), both:run.both+(c.both||0)};
    return {mois:m.mois, contrib:c, cumul:{...run}};
  });
}

      fill="none" stroke="${color}" stroke-width="1.4" opacity="0.5"/>

function chartSVG(){
  const sm = sortedMonths().slice(-12);
  if(!sm.length) return '<div class="empty">Aucune donnée à afficher.</div>';
  const series = epargneSeries().slice(-12);
  const W=880,H=220,padL=10,padR=10,padB=26,padT=14;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = sm.length;
  const bw = innerW/n*0.56;
  const gap = innerW/n;

  const revs = sm.map(m=>totalsFor(m).totalSalaire+totalsFor(m).totalEntree);
  const chgs = sm.map(m=>totalsFor(m).totalCF+totalsFor(m).totalCV);
  const eps = series.map(s=>s.cumul.both);
  const maxBar = Math.max(...revs, ...chgs, 1);
  const minEp = Math.min(...eps,0), maxEp = Math.max(...eps,1);

  const barScale = v => (v/maxBar)*innerH;
  const epScale = v => innerH - ((v-minEp)/((maxEp-minEp)||1))*innerH;

  let bars='', line='', dots='', labels='';
  sm.forEach((m,i)=>{
    const cx = padL + gap*i + gap/2;
    const rH = barScale(revs[i]);
    const cH = barScale(chgs[i]);
    bars += `<rect x="${cx-bw/2}" y="${padT+innerH-rH}" width="${bw*0.46}" height="${rH}" rx="2" fill="#101A38" opacity="0.95"/>`;
    bars += `<rect x="${cx-bw/2+bw*0.5}" y="${padT+innerH-cH}" width="${bw*0.46}" height="${cH}" rx="2" fill="#C7CDE0" opacity="0.95"/>`;
    const ly = padT + epScale(eps[i]);
    line += (i===0?'M':'L') + cx + ',' + ly + ' ';
    dots += `<circle cx="${cx}" cy="${ly}" r="3" fill="#4C5FF7"/>`;
    labels += `<text x="${cx}" y="${H-6}" font-size="10" fill="#4A5578" text-anchor="middle">${monthLabel(m.mois).split(' ')[0]}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" xmlns="http://www.w3.org/2000/svg">
    ${bars}
    <path d="${line}" fill="none" stroke="#4C5FF7" stroke-width="2.2" stroke-dasharray="4 3"/>
    ${dots}
    ${labels}
  </svg>
  <div style="display:flex; gap:18px; font-size:11.5px; color:var(--ink-soft); margin-top:6px;">
    <span>⬛ Revenus</span><span>◻ Charges</span><span>┄ Épargne cumulée</span>
  </div>`;
}

function donutChart(items){
  const total = items.reduce((s,i)=>s+i.value,0)||1;
  const R=68, C=88;
  let angle=-90;
  const colors = ['#101A38','#2A3B6E','#4C5FF7','#7C8CFF','#A6B0FF','#C7CDE0','#DDE1EC','#EEF0F5'];
  let paths='';
  items.forEach((it,idx)=>{
    const frac = it.value/total;
    if(frac<=0) return;
    const startAngle = angle;
    angle += frac*360;
    const endAngle = angle;
    const large = (endAngle-startAngle)>180?1:0;
    const x1 = C + R*Math.cos(startAngle*Math.PI/180);
    const y1 = C + R*Math.sin(startAngle*Math.PI/180);
    const x2 = C + R*Math.cos(endAngle*Math.PI/180);
    const y2 = C + R*Math.sin(endAngle*Math.PI/180);
    paths += `<path d="M${C},${C} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z" fill="${colors[idx%colors.length]}"/>`;
  });
  const legend = items.filter(i=>i.value>0).map((it,idx)=>`
    <div style="display:flex;align-items:center;gap:7px;font-size:12.5px; color:var(--ink-soft); padding:3px 0;">
      <span style="width:10px;height:10px;border-radius:2px;background:${colors[idx%colors.length]};display:inline-block; flex-shrink:0;"></span>
      <span style="flex:1;">${it.label}</span><span style="font-variant-numeric:tabular-nums; color:var(--ink);">${fmt(it.value)}</span>
    </div>`).join('');
  return `<div style="display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
    <svg width="176" height="176" viewBox="0 0 176 176" style="flex-shrink:0;">${paths}<circle cx="88" cy="88" r="40" fill="var(--white)"/></svg>
    <div style="flex:1; min-width:180px;">${legend || '<div class="empty" style="padding:10px 0;">Aucune charge ce mois.</div>'}</div>
  </div>`;
}

function groupedBarChart(series, labelA, labelB){
  if(!series.length) return '<div class="empty">Aucune donnée à afficher.</div>';
  const W=880,H=200,padL=10,padR=10,padB=24,padT=10;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const n=series.length, gap=innerW/n, bw=gap*0.6;
  const allVals = series.flatMap(s=>[s.a,s.b]);
  const maxV = Math.max(...allVals.map(Math.abs),1);
  const zeroY = padT+innerH/2;
  const scale = v => (v/maxV)*(innerH/2-6);
  let bars='', labels='';
  series.forEach((s,i)=>{
    const cx = padL+gap*i+gap/2;
    const ha = scale(s.a), hb = scale(s.b);
    bars += `<rect x="${cx-bw/2}" y="${ha>=0?zeroY-ha:zeroY}" width="${bw*0.46}" height="${Math.abs(ha)}" rx="2" fill="#101A38"/>`;
    bars += `<rect x="${cx-bw/2+bw*0.5}" y="${hb>=0?zeroY-hb:zeroY}" width="${bw*0.46}" height="${Math.abs(hb)}" rx="2" fill="#4C5FF7"/>`;
    labels += `<text x="${cx}" y="${H-6}" font-size="10" fill="#6B6B6B" text-anchor="middle">${/^\d{4}-\d{2}$/.test(s.mois) ? monthLabel(s.mois).split(' ')[0] : s.mois}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="#E1E1E1" stroke-width="1"/>
    ${bars}${labels}
  </svg>
  <div style="display:flex; gap:18px; font-size:11.5px; color:var(--ink-soft); margin-top:6px;">
    <span>⬛ ${labelA}</span><span>◻ ${labelB}</span>
  </div>`;
}

      ${epargneGoal && epargneGoal.target ? `
        <div style="font-size:13px; color:var(--ink-soft); margin-bottom:6px;">${epargneGoal.label||'Objectif'} — ${fmt(last?last.cumul.both:0)} / ${fmt(epargneGoal.target)}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${goalPct}%"></div></div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">${goalPct}% atteint</div>
      ` : `<div class="empty">Aucun objectif défini pour le moment.</div>`}
    </div>
    <div class="card">
      <h2>Évolution de l'épargne (12 derniers mois)</h2>
      ${chartSVG()}
    </div>
    <div class="card">
      <h2>Contributions Nassim vs Roxane (12 derniers mois)</h2>
      ${groupedBarChart(series.slice(0,12).reverse().map(s=>({mois:s.mois, a:s.contrib.nassim, b:s.contrib.roxane})), 'Nassim', 'Roxane')}
    </div>
    <div class="card">
      <h2>Contributions par mois</h2>
      <div style="display:flex; justify-content:flex-end; margin:-6px 0 12px;">
        <select onchange="epargneFilterYear=this.value; renderEpargne();" style="width:auto; padding:7px 10px;">
          <option value="all">Toutes les années</option>
          ${availableYears().map(y=>`<option value="${y}" ${epargneFilterYear===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      ${series.filter(s=>epargneFilterYear==='all'||s.mois.slice(0,4)===epargneFilterYear).length ? `<div class="table-scroll"><table>
        <thead><tr><th>Mois</th><th>Contribution Nassim</th><th>Contribution Roxane</th><th>Contribution commune</th><th>Cumul commun</th></tr></thead>
        <tbody>
          ${series.filter(s=>epargneFilterYear==='all'||s.mois.slice(0,4)===epargneFilterYear).map(s=>`
            <tr class="month-row" onclick="openEpargneEdit('${s.mois}')">
              <td>${monthLabel(s.mois)}</td>
              <td>${fmt(s.contrib.nassim)}</td>
              <td>${fmt(s.contrib.roxane)}</td>
              <td>${fmt(s.contrib.both)}</td>
              <td style="font-weight:600;">${fmt(s.cumul.both)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table></div>` : '<div class="empty">Aucune contribution enregistrée.</div>'}
    </div>
  `;
}

function renderProjects(){
  const el = document.getElementById('main');
  const chartData = projects.map(p=>({
    mois: p.title.length>10? p.title.slice(0,10)+'…' : p.title,
    a: p.items.filter(i=>i.checked).reduce((s,i)=>s+i.amount,0),
    b: p.items.reduce((s,i)=>s+i.amount,0)
  }));
  el.innerHTML = `
    ${projects.length ? `<div class="card">
      <h2>Budget engagé vs prévu</h2>
      ${groupedBarChart(chartData, 'Engagé', 'Budget total')}
    </div>` : ''}
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      <button class="btn gold small" onclick="addProject()">+ Nouveau projet</button>
    </div>
    ${projects.length ? projects.map(p=>{
      const total = p.items.reduce((s,i)=>s+i.amount,0);
      const done = p.items.filter(i=>i.checked).reduce((s,i)=>s+i.amount,0);
      const pct = total ? Math.round(done/total*100) : 0;
      return `<div class="card project-card">
        <div class="p-head">
          <div>
            <h2 style="margin-bottom:2px;">${p.title}</h2>
            <div style="font-size:12px; color:var(--ink-soft);">${p.target ? 'Échéance : '+monthLabel(p.target) : ''}</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn ghost small" onclick="editProject('${p.id}')">Modifier</button>
            <button class="btn danger small" onclick="deleteProject('${p.id}')">Supprimer</button>
          </div>
        </div>
        <div style="font-size:13px; color:var(--ink-soft);">Budget engagé : <strong style="color:var(--ink);">${fmt(done)}</strong> / ${fmt(total)}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="margin:12px 0 4px;">
          ${p.items.map(i=>`
            <div class="item-row">
              <input type="checkbox" ${i.checked?'checked':''} onchange="toggleItem('${p.id}','${i.id}')">
              <span class="item-label ${i.checked?'checked':''}" style="cursor:pointer;" title="Cliquer pour modifier" onclick="editItem('${p.id}','${i.id}')">${i.label}</span>
              <span class="item-amt" style="cursor:pointer;" title="Cliquer pour modifier" onclick="editItem('${p.id}','${i.id}')">${fmt(i.amount)}</span>
              <button class="btn danger small" style="padding:2px 8px;" onclick="deleteItem('${p.id}','${i.id}')">×</button>
            </div>`).join('')}
        </div>
        <div class="add-item-row">
          <input type="text" placeholder="Nouvel élément" id="newlabel-${p.id}">
          <input type="number" placeholder="Montant" style="max-width:130px;" id="newamt-${p.id}">
          <button class="btn small" onclick="addItem('${p.id}')">Ajouter</button>
        </div>
      </div>`;
    }).join('') : '<div class="empty">Aucun projet pour le moment.</div>'}
  `;
}

function render(){
  if(activeTab==='dashboard') renderDashboard();
  else if(activeTab==='charges') renderCharges();
  else if(activeTab==='epargne') renderEpargne();
  else renderProjects();
  renderHero();
}

/* ---------- Actions: projets ---------- */
function addProject(){
  const title = prompt("Nom du projet (ex : Vacances 2027)");
  if(!title) return;
  projects.push({id:uid(), title, target:'', items:[]});
  saveProjects(); render();
}
function editProject(id){
  const p = projects.find(p=>p.id===id);
  const newTitle = prompt("Nom du projet", p.title);
  if(newTitle===null) return;
  const newTarget = prompt("Échéance (AAAA-MM), laisser vide si aucune", p.target||'');
  p.title = newTitle.trim() || p.title;
  p.target = (newTarget||'').trim();
  saveProjects(); render();
}
function editItem(pid,iid){
  const p = projects.find(p=>p.id===pid);
  const it = p.items.find(i=>i.id===iid);
  const newLabel = prompt("Libellé", it.label);
  if(newLabel===null) return;
  const newAmt = prompt("Montant", it.amount);
  if(newAmt===null) return;
  it.label = newLabel.trim() || it.label;
  it.amount = parseFloat(newAmt)||0;
  saveProjects(); render();
}
function deleteProject(id){
  if(!confirm("Supprimer ce projet ?")) return;
  projects = projects.filter(p=>p.id!==id);
  saveProjects(); render();
}
function addItem(pid){
  const labelEl = document.getElementById('newlabel-'+pid);
  const amtEl = document.getElementById('newamt-'+pid);
  const label = labelEl.value.trim();
  const amount = parseFloat(amtEl.value)||0;
  if(!label) return;
  const p = projects.find(p=>p.id===pid);
  p.items.push({id:uid(), label, amount, checked:false});
  saveProjects(); render();
}
function toggleItem(pid,iid){
  const p = projects.find(p=>p.id===pid);
  const it = p.items.find(i=>i.id===iid);
  it.checked = !it.checked;
  saveProjects(); render();
}
function deleteItem(pid,iid){
  const p = projects.find(p=>p.id===pid);
  p.items = p.items.filter(i=>i.id!==iid);
  saveProjects(); render();
}

/* ---------- Actions: mois (formulaire) ---------- */
function emptyGroup(group){
  const o = {}; categories[group].forEach(c=>o[c.id]=0); return o;
}
function emptyMonth(mois){
  return {mois, entreeAnnexe:emptyGroup('entreeAnnexe'),
    salaire:{nassim:0,roxane:0},
    chargesFixes:emptyGroup('chargesFixes'),
    chargesVariables:emptyGroup('chargesVariables'), epargne:{nassim:0,roxane:0,both:0}, statut:'L'};
}
function genUntilPrompt(){
  const added = generateMonthsUntil('2027-12');
  if(added===0) alert("Tous les mois jusqu'à décembre 2027 existent déjà.");
}
function nextMoisStr(mois){
  let [y,m] = mois.split('-').map(Number);
  m++; if(m>12){m=1;y++;}
  return y+'-'+String(m).padStart(2,'0');
}
function generateMonthsUntil(endMois){
  const sm = sortedMonths();
  let cursor = sm.length ? sm[sm.length-1].mois : new Date().toISOString().slice(0,7);
  let added = 0;
  while(cursor < endMois){
    cursor = nextMoisStr(cursor);
    if(!months.find(m=>m.mois===cursor)){
      months.push(emptyMonth(cursor));
      added++;
    }
  }
  saveMonths();
  render();
  return added;
}

function fieldsFor(group, dataObj){
  return categories[group].map(cat=>`
    <div><label>${cat.label}</label><input type="number" data-group="${group}" data-cat="${cat.id}" class="dyn-field" value="${(dataObj||{})[cat.id]||0}"></div>
  `).join('');
}

function openMonthForm(mois){
  const existing = mois ? months.find(m=>m.mois===mois) : null;
  const m = existing ? JSON.parse(JSON.stringify(existing)) : emptyMonth(new Date().toISOString().slice(0,7));
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${existing? 'Modifier '+monthLabel(m.mois) : 'Nouveau mois'}</h3>
      <div class="sub">Les totaux se recalculent automatiquement. <a href="#" id="manageCatsLink" style="color:var(--ink);">Gérer les catégories de charges</a></div>
      <div class="field-grid" style="margin-bottom:14px;">
        <div><label>Mois</label><input type="month" id="f-mois" value="${m.mois}"></div>
        <div><label>Statut</label>
          <select id="f-statut">
            <option value="L" ${m.statut==='L'?'selected':''}>À traiter</option>
            <option value="J" ${m.statut==='J'?'selected':''}>En cours</option>
            <option value="O" ${m.statut==='O'?'selected':''}>Clôturé</option>
          </select>
        </div>
      </div>
      <fieldset>
        <legend>Salaires</legend>
        <div class="field-grid">
          <div><label>Nassim</label><input type="number" id="f-sal-nassim" value="${m.salaire.nassim}"></div>
          <div><label>Roxane</label><input type="number" id="f-sal-roxane" value="${m.salaire.roxane}"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Entrées annexes</legend>
        <div class="field-grid">${fieldsFor('entreeAnnexe', m.entreeAnnexe)}</div>
      </fieldset>
      <fieldset>
        <legend>Charges fixes</legend>
        <div class="field-grid">${fieldsFor('chargesFixes', m.chargesFixes)}</div>
      </fieldset>
      <fieldset>
        <legend>Charges variables</legend>
        <div class="field-grid">${fieldsFor('chargesVariables', m.chargesVariables)}</div>
      </fieldset>
      <fieldset>
        <legend>Épargne — contribution de ce mois</legend>
        <div class="field-grid">
          <div><label>Nassim</label><input type="number" id="f-ep-nassim" value="${m.epargne.nassim}"></div>
          <div><label>Roxane</label><input type="number" id="f-ep-roxane" value="${m.epargne.roxane}"></div>
        </div>
        <div style="margin-top:8px;"><label>Commun</label><input type="number" id="f-ep-both" value="${m.epargne.both}"></div>
      </fieldset>
      <div class="modal-actions">
        <div>${existing? `<button class="btn danger" onclick="deleteMonth('${m.mois}')">Supprimer ce mois</button>`:''}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn ghost" id="cancelBtn">Annuler</button>
          <button class="btn gold" id="saveBtn">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelBtn').onclick = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#manageCatsLink').onclick = (e)=>{
    e.preventDefault();
    const moisToReopen = existing ? m.mois : null;
    overlay.remove();
    openCategoryManager(()=>{ openMonthForm(moisToReopen); });
  };
  overlay.querySelector('#saveBtn').onclick = ()=>{
    const val = id => parseFloat(document.getElementById(id).value)||0;
    const newMois = document.getElementById('f-mois').value || m.mois;
    const groupVal = (group)=>{
      const o = {};
      overlay.querySelectorAll(`.dyn-field[data-group="${group}"]`).forEach(inp=>{
        o[inp.dataset.cat] = parseFloat(inp.value)||0;
      });
      return o;
    };
    const updated = {
      mois:newMois,
      statut: document.getElementById('f-statut').value,
      salaire:{nassim:val('f-sal-nassim'), roxane:val('f-sal-roxane')},
      entreeAnnexe:groupVal('entreeAnnexe'),
      chargesFixes:groupVal('chargesFixes'),
      chargesVariables:groupVal('chargesVariables'),
      epargne:{nassim:val('f-ep-nassim'), roxane:val('f-ep-roxane'), both:val('f-ep-both')}
    };
    months = months.filter(mm=>mm.mois!==m.mois);
    months.push(updated);
    saveMonths();
    overlay.remove();
    render();
  };
}
function deleteMonth(mois){
  if(!confirm("Supprimer ce mois ?")) return;
  months = months.filter(m=>m.mois!==mois);
  saveMonths();
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  render();
}

/* ---------- Gestion des catégories ---------- */
const CAT_GROUP_TITLE = {entreeAnnexe:'Entrées annexes', chargesFixes:'Charges fixes', chargesVariables:'Charges variables'};
let catManagerOnClose = null;

function catManagerBody(){
  return Object.keys(CAT_GROUP_TITLE).map(g=>`
    <fieldset>
      <legend>${CAT_GROUP_TITLE[g]}</legend>
      ${categories[g].map(cat=>`
        <div class="item-row">
          <input type="text" class="cat-label" data-group="${g}" data-cat="${cat.id}" value="${cat.label}" style="flex:1;">
          <button class="btn danger small" onclick="deleteCategory('${g}','${cat.id}')">Supprimer</button>
        </div>
      `).join('')}
      <div class="add-item-row">
        <input type="text" placeholder="Nouvelle catégorie" id="newcat-${g}">
        <button class="btn small" onclick="addCategory('${g}')">Ajouter</button>
      </div>
    </fieldset>
  `).join('');
}
function syncCatLabelsFromInputs(){
  document.querySelectorAll('.cat-label').forEach(inp=>{
    const cat = categories[inp.dataset.group].find(c=>c.id===inp.dataset.cat);
    if(cat && inp.value.trim()) cat.label = inp.value.trim();
  });
}
function openCategoryManager(onClose){
  catManagerOnClose = onClose || null;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.id = 'catManagerOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Gérer les catégories</h3>
      <div class="sub">Renomme, ajoute ou supprime les postes de charges et d'entrées, valables pour tous les mois.</div>
      <div id="catBody">${catManagerBody()}</div>
      <div class="modal-actions">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn gold" id="doneCatsBtn">Terminé</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeCategoryManager(); });
  overlay.querySelector('#doneCatsBtn').onclick = closeCategoryManager;
}
function closeCategoryManager(){
  const overlay = document.getElementById('catManagerOverlay');
  if(!overlay) return;
  syncCatLabelsFromInputs();
  saveCategories();
  overlay.remove();
  const cb = catManagerOnClose; catManagerOnClose = null;
  if(cb) cb();
  render();
}
function addCategory(group){
  syncCatLabelsFromInputs();
  const input = document.getElementById('newcat-'+group);
  const label = input.value.trim();
  if(!label) return;
  categories[group].push({id: uid(), label});
  saveCategories();
  document.getElementById('catBody').innerHTML = catManagerBody();
}
function deleteCategory(group, catId){
  if(!confirm("Supprimer cette catégorie ? Les montants déjà enregistrés sous ce poste ne seront plus affichés.")) return;
  syncCatLabelsFromInputs();
  categories[group] = categories[group].filter(c=>c.id!==catId);
  saveCategories();
  document.getElementById('catBody').innerHTML = catManagerBody();
}

/* ---------- Init ---------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});

(async function init(){
  renderUserBadge();
  if(!currentUser){ switchUser(); }
  await loadAll();
  generateMonthsUntil('2027-12');
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

</script>
